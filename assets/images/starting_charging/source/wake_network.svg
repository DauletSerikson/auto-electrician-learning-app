<svg xmlns="http://www.w3.org/2000/svg" width="320" height="584" viewBox="0 0 320 584">
<rect width="320" height="100%" fill="#ffffff"/>
<text x="16" y="32" font-family="Arial" font-size="22" fill="#122333" >W • сеть пробуждается</text>
<text x="16" y="64" font-family="Arial" font-size="18" fill="#122333" >Силовая ветвь P → Fw → N</text>
<rect x="20" y="100" width="280" height="60" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="30" y="124" font-family="Arial" font-size="19" fill="#122333" >Fw • телематика</text>
<text x="30" y="148" font-family="Arial" font-size="18" fill="#122333" >В импульсе 0,50 A</text>
<line x1="160" y1="160" x2="160" y2="190" stroke="#234b68" stroke-width="2" />
<text x="174" y="182" font-family="Arial" font-size="18" fill="#122333" >↓</text>
<rect x="20" y="190" width="280" height="60" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="30" y="214" font-family="Arial" font-size="19" fill="#122333" >Связь с gateway</text>
<text x="30" y="238" font-family="Arial" font-size="18" fill="#122333" >События по линии данных</text>
<line x1="160" y1="250" x2="160" y2="280" stroke="#234b68" stroke-width="2" />
<text x="174" y="272" font-family="Arial" font-size="18" fill="#122333" >↓</text>
<rect x="20" y="280" width="280" height="60" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="30" y="304" font-family="Arial" font-size="19" fill="#122333" >Другие блоки</text>
<text x="30" y="328" font-family="Arial" font-size="18" fill="#122333" >В импульсе ещё 1,00 A</text>
<line x1="160" y1="340" x2="160" y2="370" stroke="#234b68" stroke-width="2" />
<text x="174" y="362" font-family="Arial" font-size="18" fill="#122333" >↓</text>
<rect x="20" y="370" width="280" height="60" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="30" y="394" font-family="Arial" font-size="19" fill="#122333" >Общий ток при wake-up</text>
<text x="30" y="418" font-family="Arial" font-size="18" fill="#122333" >0,50 + 1,00 = 1,50 A</text>
<text x="16" y="460" font-family="Arial" font-size="18" fill="#122333" >Между событиями: 0,03 A.</text>
<text x="16" y="488" font-family="Arial" font-size="18" fill="#122333" >Стрелки — ход события,</text>
<text x="16" y="516" font-family="Arial" font-size="18" fill="#122333" >не последовательная нагрузка.</text>
<text x="16" y="544" font-family="Arial" font-size="18" fill="#122333" >Виновник требует проверки.</text>
</svg>
