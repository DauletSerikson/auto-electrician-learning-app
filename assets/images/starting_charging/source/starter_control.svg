<svg xmlns="http://www.w3.org/2000/svg" width="320" height="800" viewBox="0 0 320 800">
<rect width="320" height="100%" fill="#ffffff"/>
<text x="16" y="32" font-family="Arial" font-size="22" fill="#122333" >S2 • управление</text>
<text x="16" y="64" font-family="Arial" font-size="18" fill="#122333" >Запрос ≠ разрешение ≠ ток</text>
<rect x="16" y="100" width="288" height="68" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="26" y="126" font-family="Arial" font-size="20" fill="#122333" >Запрос START</text>
<text x="26" y="152" font-family="Arial" font-size="18" fill="#122333" >Вход в ECU</text>
<line x1="160" y1="168" x2="160" y2="220" stroke="#234b68" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="16" y="220" width="288" height="68" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="26" y="246" font-family="Arial" font-size="20" fill="#122333" >Условия разрешения</text>
<text x="26" y="272" font-family="Arial" font-size="18" fill="#122333" >P/N, сцепление, иммобилайзер</text>
<line x1="160" y1="288" x2="160" y2="340" stroke="#234b68" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="16" y="340" width="288" height="68" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="26" y="366" font-family="Arial" font-size="20" fill="#122333" >ECU: разрешение</text>
<text x="26" y="392" font-family="Arial" font-size="18" fill="#122333" >Логика, не силовое питание</text>
<line x1="160" y1="408" x2="160" y2="460" stroke="#234b68" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="16" y="460" width="288" height="70" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="26" y="487" font-family="Arial" font-size="18" fill="#122333" >Реле / драйвер</text>
<text x="26" y="514" font-family="Arial" font-size="18" fill="#122333" >Защищённое питание → S (50)</text>
<line x1="160" y1="530" x2="160" y2="575" stroke="#234b68" stroke-width="2" />
<rect x="16" y="575" width="288" height="68" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="26" y="602" font-family="Arial" font-size="18" fill="#122333" >Тяговое реле</text>
<text x="26" y="629" font-family="Arial" font-size="18" fill="#122333" >Управляет K в схеме S1</text>
<text x="16" y="682" font-family="Arial" font-size="18" fill="#122333" >Опора U(S,G): корпус G</text>
<text x="16" y="714" font-family="Arial" font-size="18" fill="#122333" >Логика: пунктир</text>
<text x="16" y="746" font-family="Arial" font-size="18" fill="#122333" >Питание: сплошная линия</text>
<text x="16" y="778" font-family="Arial" font-size="18" fill="#122333" >Блокировки не обходить.</text>
</svg>
