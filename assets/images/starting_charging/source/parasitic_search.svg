<svg xmlns="http://www.w3.org/2000/svg" width="320" height="618" viewBox="0 0 320 618">
<rect width="320" height="100%" fill="#ffffff"/>
<text x="16" y="32" font-family="Arial" font-size="22" fill="#122333" >P1 • поиск потребления</text>
<text x="16" y="64" font-family="Arial" font-size="18" fill="#122333" >Не изменять дефект измерением</text>
<rect x="20" y="100" width="280" height="60" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="30" y="124" font-family="Arial" font-size="19" fill="#122333" >Состояние АКБ и условия</text>
<text x="30" y="148" font-family="Arial" font-size="18" fill="#122333" >SOC / SOH / температура</text>
<line x1="160" y1="160" x2="160" y2="190" stroke="#234b68" stroke-width="2" />
<text x="174" y="182" font-family="Arial" font-size="18" fill="#122333" >↓</text>
<rect x="20" y="190" width="280" height="60" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="30" y="214" font-family="Arial" font-size="19" fill="#122333" >Общий ток во времени</text>
<text x="30" y="238" font-family="Arial" font-size="18" fill="#122333" >Sleep / события / пики</text>
<line x1="160" y1="250" x2="160" y2="280" stroke="#234b68" stroke-width="2" />
<text x="174" y="272" font-family="Arial" font-size="18" fill="#122333" >↓</text>
<rect x="20" y="280" width="280" height="60" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="30" y="304" font-family="Arial" font-size="19" fill="#122333" >Выбор ветви по данным</text>
<text x="30" y="328" font-family="Arial" font-size="18" fill="#122333" >Клещи / mV / схема</text>
<line x1="160" y1="340" x2="160" y2="370" stroke="#234b68" stroke-width="2" />
<text x="174" y="362" font-family="Arial" font-size="18" fill="#122333" >↓</text>
<rect x="20" y="370" width="280" height="60" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="30" y="394" font-family="Arial" font-size="19" fill="#122333" >Проверка причины</text>
<text x="30" y="418" font-family="Arial" font-size="18" fill="#122333" >Команда / нагрузка / связь</text>
<line x1="160" y1="430" x2="160" y2="460" stroke="#234b68" stroke-width="2" />
<text x="174" y="452" font-family="Arial" font-size="18" fill="#122333" >↓</text>
<rect x="20" y="460" width="280" height="60" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="30" y="484" font-family="Arial" font-size="19" fill="#122333" >Контроль после ремонта</text>
<text x="30" y="508" font-family="Arial" font-size="18" fill="#122333" >Повторный sleep и журнал</text>
<text x="16" y="550" font-family="Arial" font-size="18" fill="#122333" >Изоляция ветви ≠ диагноз.</text>
<text x="16" y="578" font-family="Arial" font-size="18" fill="#122333" >Дверь может разбудить сеть.</text>
</svg>
