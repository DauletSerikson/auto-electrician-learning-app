<svg xmlns="http://www.w3.org/2000/svg" width="320" height="555" viewBox="0 0 320 555">
<rect width="320" height="100%" fill="#ffffff"/>
<text x="16" y="32" font-family="Arial" font-size="22" fill="#122333" >P2 • выбор токового метода</text>
<text x="16" y="65" font-family="Arial" font-size="18" fill="#122333" >Виртуальная карточка прибора</text>
<rect x="12" y="100" width="296" height="61" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="22" y="123" font-family="Arial" font-size="18" fill="#122333" >Только учебный прибор</text>
<text x="22" y="148" font-family="Arial" font-size="19" fill="#122333" >10 A: до 30 s</text>
<rect x="12" y="170" width="296" height="61" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="22" y="193" font-family="Arial" font-size="18" fill="#122333" >Длительный предел</text>
<text x="22" y="218" font-family="Arial" font-size="19" fill="#122333" >3 A по его инструкции</text>
<rect x="12" y="240" width="296" height="61" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="22" y="263" font-family="Arial" font-size="18" fill="#122333" >Пики неизвестны</text>
<text x="22" y="288" font-family="Arial" font-size="19" fill="#122333" >Выбрать подходящие клещи</text>
<rect x="12" y="310" width="296" height="61" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="22" y="333" font-family="Arial" font-size="18" fill="#122333" >A-вход поперёк АКБ</text>
<text x="22" y="358" font-family="Arial" font-size="19" fill="#122333" >ЗАПРЕЩЕНО: замыкание</text>
<rect x="12" y="380" width="296" height="61" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="22" y="403" font-family="Arial" font-size="18" fill="#122333" >START через мультиметр</text>
<text x="22" y="428" font-family="Arial" font-size="19" fill="#122333" >ЗАПРЕЩЕНО: перегрузка</text>
<text x="16" y="462" font-family="Arial" font-size="18" fill="#122333" >Нет универсального лимита.</text>
<text x="16" y="489" font-family="Arial" font-size="18" fill="#122333" >Разрыв питания меняет sleep.</text>
<text x="16" y="516" font-family="Arial" font-size="18" fill="#122333" >Не шунтировать защиту.</text>
</svg>
