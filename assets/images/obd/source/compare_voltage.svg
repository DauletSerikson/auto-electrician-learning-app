<svg xmlns="http://www.w3.org/2000/svg" width="320" height="698" viewBox="0 0 320 698">
<rect width="320" height="100%" fill="#ffffff"/>
<text x="16" y="32" font-family="Arial" font-size="22" fill="#122333" >C • опора B−</text>
<text x="16" y="64" font-family="Arial" font-size="18" fill="#122333" >Синтетические наблюдения</text>
<text x="16" y="92" font-family="Arial" font-size="18" fill="#122333" >ХХ, стоянка, 90 °C</text>
<text x="16" y="120" font-family="Arial" font-size="18" fill="#122333" >750 rpm, load 35%, 0 km/h</text>
<text x="16" y="180" font-family="Arial" font-size="18" fill="#122333" >B+ / B− = 14,20 V</text>
<line x1="58" y1="218" x2="288" y2="218" stroke="#234b68" stroke-width="2" />
<rect id="battery" x="58" y="198" width="217.73333333333332" height="20" fill="#155b8a"/>
<text x="16" y="290" font-family="Arial" font-size="18" fill="#122333" >P_ECU / B− = 11,30 V</text>
<line x1="58" y1="328" x2="288" y2="328" stroke="#234b68" stroke-width="2" />
<rect id="ecuSupply" x="58" y="308" width="173.26666666666668" height="20" fill="#155b8a"/>
<text x="16" y="400" font-family="Arial" font-size="18" fill="#122333" >G_ECU / B− = +0,10 V</text>
<line x1="58" y1="438" x2="288" y2="438" stroke="#234b68" stroke-width="2" />
<rect id="ecuGround" x="58" y="418" width="1.5333333333333334" height="20" fill="#155b8a"/>
<text x="54" y="474" font-family="Arial" font-size="18" fill="#122333" >0</text>
<text x="264" y="474" font-family="Arial" font-size="18" fill="#122333" >15</text>
<text x="96" y="506" font-family="Arial" font-size="18" fill="#122333" >Потенциал, V</text>
<text x="16" y="552" font-family="Arial" font-size="18" fill="#122333" >U_ECU = P_ECU − G_ECU</text>
<text x="16" y="582" font-family="Arial" font-size="18" fill="#122333" >11,30 − 0,10 = 11,20 V</text>
<text x="16" y="612" font-family="Arial" font-size="18" fill="#122333" >PID 42: 11,200 V</text>
<text x="16" y="644" font-family="Arial" font-size="18" fill="#122333" >Не синхронные PID/DMM.</text>
<text x="16" y="674" font-family="Arial" font-size="18" fill="#122333" >Устойчивый режим t=0…4 s</text>
</svg>
