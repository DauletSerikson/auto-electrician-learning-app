<svg xmlns="http://www.w3.org/2000/svg" width="320" height="528" viewBox="0 0 320 528">
<rect width="320" height="100%" fill="#ffffff"/>
<text x="16" y="32" font-family="Arial" font-size="22" fill="#122333" >Код, лампа и готовность</text>
<text x="16" y="65" font-family="Arial" font-size="18" fill="#122333" >Не универсальный drive cycle</text>
<rect x="12" y="100" width="296" height="61" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="22" y="123" font-family="Arial" font-size="18" fill="#122333" >Pending</text>
<text x="22" y="148" font-family="Arial" font-size="19" fill="#122333" >Пока без подтверждения</text>
<rect x="12" y="170" width="296" height="61" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="22" y="193" font-family="Arial" font-size="18" fill="#122333" >Confirmed / stored</text>
<text x="22" y="218" font-family="Arial" font-size="19" fill="#122333" >Запись ≠ текущая причина</text>
<rect x="12" y="240" width="296" height="61" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="22" y="263" font-family="Arial" font-size="18" fill="#122333" >Permanent, где поддержан</text>
<text x="22" y="288" font-family="Arial" font-size="19" fill="#122333" >Не удаляется обычным clear</text>
<rect x="12" y="310" width="296" height="61" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="22" y="333" font-family="Arial" font-size="18" fill="#122333" >MIL</text>
<text x="22" y="358" font-family="Arial" font-size="19" fill="#122333" >Индикатор неисправности</text>
<rect x="12" y="380" width="296" height="61" rx="6" fill="#eaf3fa" stroke="#234b68"/>
<text x="22" y="403" font-family="Arial" font-size="18" fill="#122333" >Readiness</text>
<text x="22" y="428" font-family="Arial" font-size="19" fill="#122333" >Завершённость мониторов</text>
<text x="16" y="462" font-family="Arial" font-size="18" fill="#122333" >Сначала сохранить данные.</text>
<text x="16" y="489" font-family="Arial" font-size="18" fill="#122333" >Clear не является ремонтом.</text>
</svg>
