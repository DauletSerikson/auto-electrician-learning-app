<text x="16" y="403" font-family="Arial" font-size="18" fill="#122333" >16 — питание от АКБ</text>
<text x="16" y="433" font-family="Arial" font-size="18" fill="#122333" >4 — кузовная масса</text>
<text x="16" y="463" font-family="Arial" font-size="18" fill="#122333" >5 — сигнальная масса</text>
<text x="16" y="493" font-family="Arial" font-size="18" fill="#122333" >6 — CAN-H, 14 — CAN-L</text>
<text x="16" y="523" font-family="Arial" font-size="18" fill="#122333" >Для CAN-реализации OBD</text>
<text x="16" y="553" font-family="Arial" font-size="18" fill="#122333" >Остальные: сверять схему.</text>
<text x="16" y="583" font-family="Arial" font-size="18" fill="#122333" >Вид с проводов зеркальный.</text>
<text x="16" y="613" font-family="Arial" font-size="18" fill="#122333" >Не подавать питание</text>
<text x="16" y="643" font-family="Arial" font-size="18" fill="#122333" >на неизвестный контакт.</text>
