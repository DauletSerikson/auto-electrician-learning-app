<svg xmlns="http://www.w3.org/2000/svg" width="320" height="900" viewBox="0 0 320 900">
<title>ЭБУ · пути и условия</title>
<rect width="320" height="100%" fill="white"/>
<text x="20" y="34" font-family="Arial" font-size="20" text-anchor="start" font-weight="bold" fill="#172b3a">ЭБУ · пути и условия</text>
<text x="20" y="70" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Функциональные блоки</text>
<rect x="30" y="104" width="260" height="78" rx="4" fill="white" stroke="#172b3a" stroke-width="3"/>
<text x="160" y="135" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">B+ и B−: питание ЭБУ</text>
<text x="160" y="162" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">по схеме автомобиля</text>
<line x1="160" y1="182" x2="160" y2="218" stroke="#075f98" stroke-width="3"/>
<path d="M 154 209 L 160 218 L 166 209" fill="none" stroke="#172b3a" stroke-width="3"/>
<rect x="30" y="218" width="260" height="84" rx="4" fill="white" stroke="#172b3a" stroke-width="3"/>
<text x="160" y="251" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">Вход: ADC / импульсы</text>
<text x="160" y="278" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">или сообщения сети</text>
<rect x="30" y="356" width="260" height="84" rx="4" fill="white" stroke="#172b3a" stroke-width="3"/>
<text x="160" y="389" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">Программа</text>
<text x="160" y="416" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">условия → решение</text>
<rect x="30" y="494" width="260" height="84" rx="4" fill="white" stroke="#172b3a" stroke-width="3"/>
<text x="160" y="527" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">Выходной драйвер</text>
<text x="160" y="554" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">коммутирует ток</text>
<line x1="160" y1="302" x2="160" y2="356" stroke="#075f98" stroke-width="3"/>
<path d="M 154 347 L 160 356 L 166 347" fill="none" stroke="#172b3a" stroke-width="3"/>
<line x1="160" y1="440" x2="160" y2="494" stroke="#075f98" stroke-width="3"/>
<path d="M 154 485 L 160 494 L 166 485" fill="none" stroke="#172b3a" stroke-width="3"/>
<line x1="160" y1="578" x2="160" y2="631" stroke="#075f98" stroke-width="3"/>
<path d="M 154 622 L 160 631 L 166 622" fill="none" stroke="#172b3a" stroke-width="3"/>
<rect x="30" y="631" width="260" height="84" rx="4" fill="white" stroke="#172b3a" stroke-width="3"/>
<text x="160" y="665" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">Нагрузка и её питание</text>
<text x="160" y="692" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">по отдельной силовой ветви</text>
<text x="20" y="760" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">R: reference для датчика</text>
<text x="20" y="790" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">не заменяет питание ЭБУ.</text>
<text x="20" y="830" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Код ошибки ≠ готовый диагноз</text>
<text x="20" y="860" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Команда ≠ доказанный ток</text>
</svg>
