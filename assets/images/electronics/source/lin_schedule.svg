<svg xmlns="http://www.w3.org/2000/svg" width="320" height="720" viewBox="0 0 320 720">
<title>LIN · header и response</title>
<rect width="320" height="100%" fill="white"/>
<text x="20" y="34" font-family="Arial" font-size="20" text-anchor="start" font-weight="bold" fill="#172b3a">LIN · header и response</text>
<text x="20" y="70" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Последовательность, не график</text>
<rect x="30" y="110" width="260" height="100" rx="4" fill="white" stroke="#172b3a" stroke-width="3"/>
<text x="160" y="145" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">Расписание commander C</text>
<text x="160" y="177" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">выбирает следующий кадр</text>
<line x1="160" y1="210" x2="160" y2="269" stroke="#075f98" stroke-width="3"/>
<path d="M 154 260 L 160 269 L 166 260" fill="none" stroke="#172b3a" stroke-width="3"/>
<rect x="30" y="269" width="260" height="100" rx="4" fill="white" stroke="#172b3a" stroke-width="3"/>
<text x="160" y="304" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">Header от C</text>
<text x="160" y="336" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">идентифицирует кадр</text>
<line x1="160" y1="369" x2="160" y2="428" stroke="#075f98" stroke-width="3"/>
<path d="M 154 419 L 160 428 L 166 419" fill="none" stroke="#172b3a" stroke-width="3"/>
<rect x="30" y="428" width="260" height="100" rx="4" fill="white" stroke="#172b3a" stroke-width="3"/>
<text x="160" y="463" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">Response от издателя A</text>
<text x="160" y="495" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">данные + контрольная сумма</text>
<text x="20" y="581" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">В этом кадре издатель A.</text>
<text x="20" y="614" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">В другом им может быть C.</text>
<text x="20" y="663" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Не показаны уровни/время.</text>
<text x="20" y="696" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Положение окна — данные.</text>
</svg>
