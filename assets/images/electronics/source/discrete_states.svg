<text x="20" y="70" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">ON; 1…3 s контакт закрыт</text>
<text x="20" y="103" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">U(S,G), V</text>
<line x1="54" y1="125" x2="54" y2="255" stroke="#172b3a" stroke-width="3"/>
<line x1="54" y1="255" x2="290" y2="255" stroke="#172b3a" stroke-width="3"/>
<line x1="49" y1="255.0" x2="54" y2="255.0" stroke="#172b3a" stroke-width="3"/>
<text x="44" y="261.0" font-family="Arial" font-size="18" text-anchor="end" font-weight="normal" fill="#172b3a">0</text>
<line x1="49" y1="125.0" x2="54" y2="125.0" stroke="#172b3a" stroke-width="3"/>
<text x="44" y="131.0" font-family="Arial" font-size="18" text-anchor="end" font-weight="normal" fill="#172b3a">5</text>
<line x1="54" y1="125.0" x2="290" y2="125.0" stroke="#b9c6ce" stroke-width="3" stroke-dasharray="6 5"/>
<line x1="54.0" y1="255" x2="54.0" y2="260" stroke="#172b3a" stroke-width="3"/>
<text x="54.0" y="283" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">0</text>
<line x1="172.0" y1="255" x2="172.0" y2="260" stroke="#172b3a" stroke-width="3"/>
<text x="172.0" y="283" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">2</text>
<line x1="290.0" y1="255" x2="290.0" y2="260" stroke="#172b3a" stroke-width="3"/>
<text x="290.0" y="283" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">4</text>
<text x="172" y="310" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">t, s</text>
<polyline id="discrete_time" points="54,125 113,125 113,255 231,255 231,125 290,125" fill="none" stroke="#075f98" stroke-width="3" stroke-linejoin="round"/>
<text x="20" y="350" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">5 V: открыт; 0 V: закрыт.</text>
<text x="20" y="377" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Моменты переключения заданы.</text>
<text x="20" y="404" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Это не поток сетевых сообщений.</text>
