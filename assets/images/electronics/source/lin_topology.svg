<svg xmlns="http://www.w3.org/2000/svg" width="320" height="980" viewBox="0 0 320 980">
<title>E08L · локальная LIN</title>
<rect width="320" height="100%" fill="white"/>
<text x="20" y="34" font-family="Arial" font-size="20" text-anchor="start" font-weight="bold" fill="#172b3a">E08L · локальная LIN</text>
<text x="20" y="70" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">12 V; G общая; ON, awake</text>
<text x="44" y="106" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">LIN</text>
<line x1="44" y1="122" x2="44" y2="800" stroke="#172b3a" stroke-width="3"/>
<text x="104" y="116" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">12 V</text>
<line x1="104" y1="124" x2="104" y2="144" stroke="#172b3a" stroke-width="3"/>
<polygon points="89,144 119,144 104,171" fill="white" stroke="#172b3a" stroke-width="3"/>
<line x1="89" y1="176" x2="119" y2="176" stroke="#172b3a" stroke-width="3"/>
<line x1="104" y1="176" x2="104" y2="197" stroke="#172b3a" stroke-width="3"/>
<rect x="92" y="197" width="24" height="40" rx="4" fill="white" stroke="#172b3a" stroke-width="3"/>
<text x="126" y="223" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Rp</text>
<line x1="104" y1="237" x2="104" y2="264" stroke="#172b3a" stroke-width="3"/>
<line x1="104" y1="264" x2="44" y2="264" stroke="#172b3a" stroke-width="3"/>
<circle cx="44" cy="264" r="4" fill="#172b3a"/>
<text x="126" y="266" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Подтяжка C</text>
<rect x="110" y="335" width="190" height="120" rx="4" fill="white" stroke="#172b3a" stroke-width="3"/>
<text x="205" y="365" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">C: commander</text>
<text x="205" y="396" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">transceiver</text>
<text x="205" y="426" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">12 V / G отдельно</text>
<line x1="44" y1="396" x2="110" y2="396" stroke="#172b3a" stroke-width="3"/>
<circle cx="44" cy="396" r="4" fill="#172b3a"/>
<rect x="110" y="490" width="190" height="120" rx="4" fill="white" stroke="#172b3a" stroke-width="3"/>
<text x="205" y="520" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">A: responder</text>
<text x="205" y="551" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">transceiver</text>
<text x="205" y="581" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">12 V / G отдельно</text>
<line x1="44" y1="551" x2="110" y2="551" stroke="#172b3a" stroke-width="3"/>
<circle cx="44" cy="551" r="4" fill="#172b3a"/>
<rect x="110" y="645" width="190" height="120" rx="4" fill="white" stroke="#172b3a" stroke-width="3"/>
<text x="205" y="675" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">B: responder</text>
<text x="205" y="706" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">transceiver</text>
<text x="205" y="736" font-family="Arial" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b3a">12 V / G отдельно</text>
<line x1="44" y1="706" x2="110" y2="706" stroke="#172b3a" stroke-width="3"/>
<circle cx="44" cy="706" r="4" fill="#172b3a"/>
<text x="20" y="836" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Одна линия данных ≠ питание</text>
<text x="20" y="869" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Выходы могут тянуть LIN к G.</text>
<text x="20" y="902" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Recessive: около питания</text>
<text x="20" y="935" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Dominant: около массы</text>
</svg>
