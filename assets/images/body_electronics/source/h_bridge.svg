x="185" y="156" font-family="Arial" font-size="16" fill="#193b53">QBH</text><line x1="245" y1="240" x2="245" y2="304" stroke="#193b53" stroke-width="2" data-from="B" data-to="QBL"/><line x1="245" y1="336" x2="245" y2="390" stroke="#193b53" stroke-width="2" data-from="QBL" data-to="N"/><rect x="227" y="304" width="36" height="32" rx="5" fill="#fff0d2" stroke="#193b53"/><text x="235" y="326.0" font-family="Arial" font-size="17" fill="#193b53"></text><text x="185" y="326" font-family="Arial" font-size="16" fill="#193b53">QBL</text><circle cx="75" cy="240" r="4" fill="#17618b" id="node-A" data-node="A"/><text x="85" y="231" font-family="Arial" font-size="17" fill="#193b53">A</text><circle cx="245" cy="240" r="4" fill="#17618b" id="node-B" data-node="B"/><text x="255" y="231" font-family="Arial" font-size="17" fill="#193b53">B</text><line x1="75" y1="240" x2="133" y2="240" stroke="#193b53" stroke-width="2" data-from="A" data-to="motor"/><line x1="187" y1="240" x2="245" y2="240" stroke="#193b53" stroke-width="2" data-from="motor" data-to="B"/><circle cx="160" cy="240" r="27" fill="white" stroke="#193b53"/><text x="150" y="247" font-family="Arial" font-size="22" fill="#193b53">M</text><g id="state-forward" data-closed="QAH QBL" data-a="12" data-b="0"><text x="14" y="460" font-family="Arial" font-size="17" fill="#193b53">A=12, B=0, U=12 V</text></g><g id="state-reverse" data-closed="QBH QAL" data-a="0" data-b="12"><text x="14" y="488" font-family="Arial" font-size="17" fill="#193b53">A=0, B=12, U=-12 V</text></g><g id="state-brakeLow" data-closed="QAL QBL" data-a="0" data-b="0"><text x="14" y="516" font-family="Arial" font-size="17" fill="#193b53">A=0, B=0, U=0 V</text></g><g id="state-brakeHigh" data-closed="QAH QBH" data-a="12" data-b="12"><text x="14" y="544" font-family="Arial" font-size="17" fill="#193b53">A=12, B=12, U=0 V</text></g><g id="state-coast" data-closed="" data-a="None" data-b="None"><text x="14" y="572" font-family="Arial" font-size="17" fill="#193b53">не заданы</text></g><text x="14" y="625" font-family="Arial" font-size="17" fill="#193b53">Ход A→B: QAH + QBL.</text><text x="14" y="655" font-family="Arial" font-size="17" fill="#193b53">Ход B→A: QBH + QAL.</text><text x="14" y="685" font-family="Arial" font-size="17" fill="#193b53">Торможение: QAL + QBL.</text><text x="14" y="715" font-family="Arial" font-size="17" fill="#193b53">Hi-Z: все ключи открыты.</text><text x="14" y="745" font-family="Arial" font-size="17" fill="#193b53">В Hi-Z потенциалы не заданы.</text><text x="14" y="775" font-family="Arial" font-size="17" fill="#193b53">Одна стойка: H и L вместе</text><text x="14" y="799" font-family="Arial" font-size="17" fill="#193b53">запрещены.</text><text x="14" y="829" font-family="Arial" font-size="17" fill="#193b53">Это схема, не pinout драйвера.</text></svg>