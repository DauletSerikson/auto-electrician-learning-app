<svg xmlns="http://www.w3.org/2000/svg" width="320" height="705" viewBox="0 0 320 705"><rect width="320" height="705" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">Разные цепи освещения</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><text x="14" y="100" font-family="Arial" font-size="19" fill="#193b53">Релейный канал</text><text x="14" y="128" font-family="Arial" font-size="17" fill="#193b53">Своё B+ → F →</text><rect x="16" y="145" width="288" height="45" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="173.5" font-family="Arial" font-size="17" fill="#193b53">Реле → лампа → G → N</text><text x="14" y="230" font-family="Arial" font-size="19" fill="#193b53">High-side канал</text><text x="14" y="258" font-family="Arial" font-size="17" fill="#193b53">Своё B+ → F →</text><rect x="16" y="275" width="288" height="45" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="303.5" font-family="Arial" font-size="17" fill="#193b53">Ключ → лампа → G → N</text><text x="14" y="360" font-family="Arial" font-size="19" fill="#193b53">LED с драйвером</text><text x="14" y="388" font-family="Arial" font-size="17" fill="#193b53">Своё B+ → F →</text><rect x="16" y="405" width="288" height="45" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="433.5" font-family="Arial" font-size="17" fill="#193b53">LED-драйвер → LED</text><text x="14" y="495" font-family="Arial" font-size="17" fill="#193b53">Три независимые схемы.</text><text x="14" y="525" font-family="Arial" font-size="17" fill="#193b53">Первые две: обычная лампа.</text><text x="14" y="555" font-family="Arial" font-size="17" fill="#193b53">LED: возврат и управление</text><text x="14" y="579" font-family="Arial" font-size="17" fill="#193b53">определяет схема драйвера.</text><text x="14" y="609" font-family="Arial" font-size="17" fill="#193b53">Enable/PWM — команда, не</text><text x="14" y="633" font-family="Arial" font-size="17" fill="#193b53">обязательно мощность.</text><text x="14" y="663" font-family="Arial" font-size="17" fill="#193b53">Критерии LED задаёт его схема.</text></svg>