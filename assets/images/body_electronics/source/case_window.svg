<svg xmlns="http://www.w3.org/2000/svg" width="320" height="690" viewBox="0 0 320 690"><rect width="320" height="690" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">K2 • только одно</text><text x="14" y="47" font-family="Arial" font-size="19" fill="#193b53">направление</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><text x="16" y="95" font-family="Arial" font-size="19" fill="#193b53">DOWN: движение</text><circle cx="45" cy="160" r="4" fill="#17618b" id="node-A-95" data-node="A-95" data-voltage="12"/><text x="55" y="151" font-family="Arial" font-size="17" fill="#193b53">A</text><circle cx="270" cy="160" r="4" fill="#17618b" id="node-B-95" data-node="B-95" data-voltage="0"/><text x="280" y="151" font-family="Arial" font-size="17" fill="#193b53">B</text><line x1="45" y1="160" x2="125" y2="160" stroke="#193b53" stroke-width="2" /><rect x="125" y="135" width="70" height="50" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="133" y="166.0" font-family="Arial" font-size="17" fill="#193b53">M</text><line x1="195" y1="160" x2="270" y2="160" stroke="#193b53" stroke-width="2" /><text x="30" y="205" font-family="Arial" font-size="17" fill="#193b53">A/N=12 V; B/N=0 V</text><text x="30" y="240" font-family="Arial" font-size="17" fill="#193b53">U(A,B)=12 V; I=2 A</text><text x="16" y="300" font-family="Arial" font-size="19" fill="#193b53">UP: движения нет</text><circle cx="45" cy="365" r="4" fill="#17618b" id="node-A-300" data-node="A-300" data-voltage="0"/><text x="55" y="356" font-family="Arial" font-size="17" fill="#193b53">A</text><circle cx="270" cy="365" r="4" fill="#17618b" id="node-B-300" data-node="B-300" data-voltage="0"/><text x="280" y="356" font-family="Arial" font-size="17" fill="#193b53">B</text><line x1="45" y1="365" x2="125" y2="365" stroke="#193b53" stroke-width="2" /><rect x="125" y="340" width="70" height="50" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="133" y="371.0" font-family="Arial" font-size="17" fill="#193b53">M</text><line x1="195" y1="365" x2="270" y2="365" stroke="#193b53" stroke-width="2" /><text x="30" y="410" font-family="Arial" font-size="17" fill="#193b53">A/N=0 V; B/N=0 V</text><text x="30" y="445" font-family="Arial" font-size="17" fill="#193b53">U(A,B)=0 V; I=0 A</text><text x="14" y="510" font-family="Arial" font-size="17" fill="#193b53">VM=12 V; запрос UP принят.</text><text x="14" y="540" font-family="Arial" font-size="17" fill="#193b53">Окно 100–200 ms после команды.</text><text x="14" y="570" font-family="Arial" font-size="17" fill="#193b53">0/0 V не даёт единственный</text><text x="14" y="594" font-family="Arial" font-size="17" fill="#193b53">диагноз.</text><text x="14" y="624" font-family="Arial" font-size="17" fill="#193b53">Нужны разрешения, защита,</text><text x="14" y="648" font-family="Arial" font-size="17" fill="#193b53">ранняя запись U и тока.</text></svg>