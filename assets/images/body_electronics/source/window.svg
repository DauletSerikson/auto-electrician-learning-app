<svg xmlns="http://www.w3.org/2000/svg" width="320" height="708" viewBox="0 0 320 708"><rect width="320" height="708" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">Стеклоподъёмник</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><rect x="35" y="90" width="250" height="200" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="43" y="196.0" font-family="Arial" font-size="17" fill="#193b53"></text><rect x="55" y="115" width="210" height="120" fill="#d9edf5" stroke="#193b53"/><text x="88" y="180" font-family="Arial" font-size="17" fill="#193b53">СТЕКЛО</text><line x1="155" y1="250" x2="155" y2="330" stroke="#193b53" stroke-width="2" /><text x="170" y="310" font-family="Arial" font-size="17" fill="#193b53">↑ / ↓</text><rect x="90" y="330" width="140" height="45" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="98" y="358.5" font-family="Arial" font-size="17" fill="#193b53">Мотор A/B</text><text x="14" y="420" font-family="Arial" font-size="17" fill="#193b53">Кнопка → дверной модуль → мост</text><text x="14" y="444" font-family="Arial" font-size="17" fill="#193b53">→ мотор.</text><text x="14" y="474" font-family="Arial" font-size="17" fill="#193b53">Датчик/оценка хода → модуль.</text><text x="14" y="504" font-family="Arial" font-size="17" fill="#193b53">Препятствие ≠ только отказ</text><text x="14" y="528" font-family="Arial" font-size="17" fill="#193b53">мотора.</text><text x="14" y="558" font-family="Arial" font-size="17" fill="#193b53">Anti-pinch не отключают.</text><text x="14" y="588" font-family="Arial" font-size="17" fill="#193b53">Проверка частью тела</text><text x="14" y="612" font-family="Arial" font-size="17" fill="#193b53">запрещена.</text><text x="14" y="642" font-family="Arial" font-size="17" fill="#193b53">Положение и обучение зависят</text><text x="14" y="666" font-family="Arial" font-size="17" fill="#193b53">от конструкции.</text></svg>