<svg xmlns="http://www.w3.org/2000/svg" width="320" height="622" viewBox="0 0 320 622"><rect width="320" height="622" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">Дверной привод</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><rect x="55" y="90" width="210" height="60" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="63" y="126.0" font-family="Arial" font-size="17" fill="#193b53">Дверной мост</text><circle cx="90" cy="180" r="4" fill="#17618b" id="node-DA" data-node="DA" data-voltage="12"/><text x="100" y="171" font-family="Arial" font-size="17" fill="#193b53">DA</text><circle cx="230" cy="180" r="4" fill="#17618b" id="node-DB" data-node="DB" data-voltage="0"/><text x="240" y="171" font-family="Arial" font-size="17" fill="#193b53">DB</text><line x1="90" y1="150" x2="90" y2="180" stroke="#193b53" stroke-width="2" data-from="bridge" data-to="DA"/><line x1="230" y1="150" x2="230" y2="180" stroke="#193b53" stroke-width="2" data-from="bridge" data-to="DB"/><line x1="90" y1="180" x2="90" y2="300" stroke="#193b53" stroke-width="2" data-from="DA" data-to="A"/><line x1="230" y1="180" x2="230" y2="300" stroke="#193b53" stroke-width="2" data-from="DB" data-to="B"/><circle cx="90" cy="300" r="4" fill="#17618b" id="node-A" data-node="A" data-voltage="12"/><text x="100" y="291" font-family="Arial" font-size="17" fill="#193b53">A</text><circle cx="230" cy="300" r="4" fill="#17618b" id="node-B" data-node="B" data-voltage="0"/><text x="240" y="291" font-family="Arial" font-size="17" fill="#193b53">B</text><line x1="90" y1="300" x2="135" y2="300" stroke="#193b53" stroke-width="2" data-from="A" data-to="motor"/><line x1="185" y1="300" x2="230" y2="300" stroke="#193b53" stroke-width="2" data-from="motor" data-to="B"/><circle cx="160" cy="300" r="25" fill="#eef6fb" stroke="#193b53"/><text x="151" y="306" font-family="Arial" font-size="20" fill="#193b53">M</text><text x="24" y="360" font-family="Arial" font-size="17" fill="#193b53">B+ → F → VM; N = 0 V</text><text x="24" y="390" font-family="Arial" font-size="17" fill="#193b53">LOCK: DA=12 V; DB=0 V</text><text x="14" y="430" font-family="Arial" font-size="17" fill="#193b53">Источник 12 V; LOCK 300 ms.</text><text x="14" y="460" font-family="Arial" font-size="17" fill="#193b53">Окно записи 100–200 ms.</text><text x="14" y="490" font-family="Arial" font-size="17" fill="#193b53">A/B — выводы мотора.</text><text x="14" y="520" font-family="Arial" font-size="17" fill="#193b53">DA/DB — выходы моста.</text><text x="14" y="550" font-family="Arial" font-size="17" fill="#193b53">LOCK: ток A → M → B.</text><text x="14" y="580" font-family="Arial" font-size="17" fill="#193b53">UNLOCK: полярность обратная.</text></svg>