<svg xmlns="http://www.w3.org/2000/svg" width="320" height="846" viewBox="0 0 320 846"><rect width="320" height="846" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">K4 • сигнал не дошёл</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><text x="18" y="90" font-family="Arial" font-size="17" fill="#193b53">Силовой путь: 12 V</text><rect x="35" y="110" width="250" height="44" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="43" y="138.0" font-family="Arial" font-size="17" fill="#193b53">B+ → F → выход → P</text><line x1="160" y1="154" x2="160" y2="185" stroke="#193b53" stroke-width="2" /><rect x="85" y="185" width="150" height="44" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="93" y="213.0" font-family="Arial" font-size="17" fill="#193b53">Мотор → N</text><text x="18" y="270" font-family="Arial" font-size="17" fill="#193b53">Отдельный вход park: 5 V</text><text x="190" y="310" font-family="Arial" font-size="17" fill="#193b53">+5 V</text><line x1="230" y1="318" x2="230" y2="344" stroke="#193b53" stroke-width="2" /><rect x="210" y="344" width="40" height="42" rx="5" fill="#fff0d2" stroke="#193b53"/><text x="218" y="371.0" font-family="Arial" font-size="17" fill="#193b53"></text><text x="130" y="370" font-family="Arial" font-size="17" fill="#193b53">10 kΩ</text><line x1="230" y1="386" x2="230" y2="420" stroke="#193b53" stroke-width="2" /><circle cx="230" cy="420" r="4" fill="#17618b" id="node-S" data-node="S" data-voltage="5"/><text x="240" y="411" font-family="Arial" font-size="17" fill="#193b53">S</text><circle cx="65" cy="420" r="4" fill="#17618b" id="node-K" data-node="K" data-voltage="0"/><text x="75" y="411" font-family="Arial" font-size="17" fill="#193b53">K</text><line x1="65" y1="420" x2="65" y2="480" stroke="#193b53" stroke-width="2" /><line x1="65" y1="480" x2="65" y2="510" stroke="#193b53" stroke-width="2" /><line x1="65" y1="510" x2="100" y2="510" stroke="#193b53" stroke-width="2" /><text x="108" y="515" font-family="Arial" font-size="17" fill="#193b53">N; park замкнут</text><text x="18" y="560" font-family="Arial" font-size="17" fill="#193b53">Kpark: контакт K → N</text><line x1="65" y1="420" x2="130" y2="420" stroke="#193b53" stroke-width="2" data-from="K" data-to="break"/><line x1="155" y1="420" x2="230" y2="420" stroke="#193b53" stroke-width="2" data-from="break" data-to="S"/><line x1="130" y1="408" x2="155" y2="432" stroke="#ad392f" stroke-width="2" /><line x1="130" y1="432" x2="155" y2="408" stroke="#ad392f" stroke-width="2" /><text x="14" y="600" font-family="Arial" font-size="17" fill="#193b53">В park: K=0 V.</text><text x="14" y="630" font-family="Arial" font-size="17" fill="#193b53">S=5 V при обрыве K–S.</text><text x="14" y="660" font-family="Arial" font-size="17" fill="#193b53">Вне park контакт открыт.</text><text x="14" y="690" font-family="Arial" font-size="17" fill="#193b53">Классический самоподхват</text><text x="14" y="714" font-family="Arial" font-size="17" fill="#193b53">контактом — другая схема.</text><text x="14" y="744" font-family="Arial" font-size="17" fill="#193b53">Здесь OFF → ход до park.</text><text x="14" y="774" font-family="Arial" font-size="17" fill="#193b53">Нет park → OFF через 2 s.</text><text x="14" y="804" font-family="Arial" font-size="17" fill="#193b53">Тайм-аут задан моделью.</text></svg>