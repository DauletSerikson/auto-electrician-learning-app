<svg xmlns="http://www.w3.org/2000/svg" width="320" height="915" viewBox="0 0 320 915"><rect width="320" height="915" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">K5 • ступени вентилятора</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><text x="18" y="95" font-family="Arial" font-size="17" fill="#193b53">B+ 12 V → F → мотор</text><line x1="160" y1="108" x2="160" y2="145" stroke="#193b53" stroke-width="2" /><rect x="100" y="145" width="120" height="50" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="108" y="176.0" font-family="Arial" font-size="17" fill="#193b53">M</text><line x1="160" y1="195" x2="160" y2="230" stroke="#193b53" stroke-width="2" /><circle cx="160" cy="230" r="4" fill="#17618b" id="node-C" data-node="C" data-voltage="12"/><text x="170" y="221" font-family="Arial" font-size="17" fill="#193b53">C</text><line x1="40" y1="230" x2="280" y2="230" stroke="#193b53" stroke-width="2" /><line x1="40" y1="230" x2="40" y2="275" stroke="#193b53" stroke-width="2" /><text x="15" y="260" font-family="Arial" font-size="15" fill="#193b53">LOW</text><line x1="40" y1="275" x2="40" y2="295" stroke="#193b53" stroke-width="2" id="selector-LOW" data-closed="true"/><line x1="40" y1="295" x2="40" y2="300" stroke="#193b53" stroke-width="2" /><rect x="23" y="300" width="34" height="50" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="31" y="331.0" font-family="Arial" font-size="17" fill="#193b53"></text><text x="20" y="380" font-family="Arial" font-size="16" fill="#193b53">1 Ω</text><line x1="40" y1="350" x2="40" y2="410" stroke="#193b53" stroke-width="2" /><line x1="160" y1="230" x2="160" y2="275" stroke="#193b53" stroke-width="2" /><text x="135" y="260" font-family="Arial" font-size="15" fill="#193b53">MED</text><line x1="160" y1="275" x2="173" y2="295" stroke="#193b53" stroke-width="2" id="selector-MED" data-closed="false"/><line x1="160" y1="295" x2="160" y2="300" stroke="#193b53" stroke-width="2" /><rect x="143" y="300" width="34" height="50" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="151" y="331.0" font-family="Arial" font-size="17" fill="#193b53"></text><text x="140" y="380" font-family="Arial" font-size="16" fill="#193b53">0,5 Ω</text><line x1="160" y1="350" x2="160" y2="410" stroke="#193b53" stroke-width="2" /><line x1="280" y1="230" x2="280" y2="275" stroke="#193b53" stroke-width="2" /><text x="255" y="260" font-family="Arial" font-size="15" fill="#193b53">HIGH</text><line x1="280" y1="275" x2="293" y2="295" stroke="#193b53" stroke-width="2" id="selector-HIGH" data-closed="false"/><line x1="280" y1="295" x2="280" y2="300" stroke="#193b53" stroke-width="2" /><line x1="280" y1="300" x2="280" y2="540" stroke="#193b53" stroke-width="2" /><text x="225" y="390" font-family="Arial" font-size="14" fill="#193b53">напрямую</text><line x1="40" y1="410" x2="160" y2="410" stroke="#193b53" stroke-width="2" /><line x1="100" y1="410" x2="100" y2="455" stroke="#193b53" stroke-width="2" /><line x1="100" y1="455" x2="100" y2="475" stroke="#193b53" stroke-width="2" /><line x1="88" y1="475" x2="112" y2="495" stroke="#ad392f" stroke-width="2" /><line x1="88" y1="495" x2="112" y2="475" stroke="#ad392f" stroke-width="2" /><line x1="100" y1="495" x2="100" y2="540" stroke="#193b53" stroke-width="2" /><text x="120" y="485" font-family="Arial" font-size="18" fill="#ad392f">T: OL</text><line x1="100" y1="540" x2="280" y2="540" stroke="#193b53" stroke-width="2" /><text x="170" y="572" font-family="Arial" font-size="17" fill="#193b53">N = 0 V</text><text x="14" y="615" font-family="Arial" font-size="17" fill="#193b53">Показан LOW: MED/HIGH открыты.</text><text x="14" y="645" font-family="Arial" font-size="17" fill="#193b53">Селектор замыкает только одну</text><text x="14" y="669" font-family="Arial" font-size="17" fill="#193b53">ветвь; OFF — разрыв.</text><text x="14" y="699" font-family="Arial" font-size="17" fill="#193b53">LOW/MED: общий T разорван.</text><text x="14" y="729" font-family="Arial" font-size="17" fill="#193b53">HIGH обходит R и T.</text><text x="14" y="759" font-family="Arial" font-size="17" fill="#193b53">LOW/MED: C=12 V, I=0.</text><text x="14" y="789" font-family="Arial" font-size="17" fill="#193b53">HIGH: C=0 V, I=6 A.</text><text x="14" y="819" font-family="Arial" font-size="17" fill="#193b53">T нельзя шунтировать.</text><text x="14" y="849" font-family="Arial" font-size="17" fill="#193b53">Электронный регулятор — иная</text><text x="14" y="873" font-family="Arial" font-size="17" fill="#193b53">архитектура.</text></svg>