<svg xmlns="http://www.w3.org/2000/svg" width="320" height="775" viewBox="0 0 320 775"><rect width="320" height="775" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">K3 • потери обратного пути</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><text x="20" y="90" font-family="Arial" font-size="17" fill="#193b53">K3 • постоянный свет, ON</text><circle cx="75" cy="140" r="4" fill="#17618b" id="node-B+" data-node="B+" data-voltage="12"/><text x="85" y="131" font-family="Arial" font-size="17" fill="#193b53">B+</text><text x="175" y="147" font-family="Arial" font-size="17" fill="#193b53">12 V</text><circle cx="75" cy="250" r="4" fill="#17618b" id="node-P" data-node="P" data-voltage="11.7"/><text x="85" y="241" font-family="Arial" font-size="17" fill="#193b53">P</text><text x="175" y="257" font-family="Arial" font-size="17" fill="#193b53">11.7 V</text><circle cx="75" cy="370" r="4" fill="#17618b" id="node-G" data-node="G" data-voltage="2.7"/><text x="85" y="361" font-family="Arial" font-size="17" fill="#193b53">G</text><text x="175" y="377" font-family="Arial" font-size="17" fill="#193b53">2.7 V</text><circle cx="75" cy="490" r="4" fill="#17618b" id="node-N" data-node="N" data-voltage="0"/><text x="85" y="481" font-family="Arial" font-size="17" fill="#193b53">N</text><text x="175" y="497" font-family="Arial" font-size="17" fill="#193b53">0 V</text><line x1="75" y1="140" x2="75" y2="180.0" stroke="#193b53" stroke-width="2" data-from="B+" data-to="RP"/><line x1="75" y1="210.0" x2="75" y2="250" stroke="#193b53" stroke-width="2" data-from="RP" data-to="P"/><rect id="resistor-B+-P" data-resistance="0.1" x="62" y="180.0" width="26" height="30" fill="#fff0d2" stroke="#193b53"/><text x="106" y="200.0" font-family="Arial" font-size="17" fill="#193b53">0.1 Ω</text><line x1="75" y1="250" x2="75" y2="295.0" stroke="#193b53" stroke-width="2" data-from="P" data-to="RG"/><line x1="75" y1="325.0" x2="75" y2="370" stroke="#193b53" stroke-width="2" data-from="RG" data-to="G"/><rect id="resistor-P-G" data-resistance="3" x="62" y="295.0" width="26" height="30" fill="#fff0d2" stroke="#193b53"/><text x="106" y="315.0" font-family="Arial" font-size="17" fill="#193b53">3 Ω</text><line x1="75" y1="370" x2="75" y2="415.0" stroke="#193b53" stroke-width="2" data-from="G" data-to="RN"/><line x1="75" y1="445.0" x2="75" y2="490" stroke="#193b53" stroke-width="2" data-from="RN" data-to="N"/><rect id="resistor-G-N" data-resistance="0.9" x="62" y="415.0" width="26" height="30" fill="#fff0d2" stroke="#193b53"/><text x="106" y="435.0" font-family="Arial" font-size="17" fill="#193b53">0.9 Ω</text><text x="14" y="535" font-family="Arial" font-size="17" fill="#193b53">B+ → F/реле → P → лампа → G →</text><text x="14" y="559" font-family="Arial" font-size="17" fill="#193b53">N.</text><text x="14" y="589" font-family="Arial" font-size="17" fill="#193b53">F и реле включены, идеальны.</text><text x="14" y="619" font-family="Arial" font-size="17" fill="#193b53">I=3 A; U(P,G)=9 V.</text><text x="14" y="649" font-family="Arial" font-size="17" fill="#193b53">Плюс: 0,3 V; масса: 2,7 V.</text><text x="14" y="679" font-family="Arial" font-size="17" fill="#193b53">3 Ω — эквивалент нити в этой</text><text x="14" y="703" font-family="Arial" font-size="17" fill="#193b53">рабочей точке, не LED.</text><text x="14" y="733" font-family="Arial" font-size="17" fill="#193b53">OFF: G/N=0 при I=0.</text></svg>