<svg xmlns="http://www.w3.org/2000/svg" width="320" height="525" viewBox="0 0 320 525"><rect width="320" height="525" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">HVAC • привод заслонки</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#193b53"/></marker></defs><rect x="24" y="85" width="272" height="48" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="32" y="115.0" font-family="Arial" font-size="17" fill="#193b53">Температура → контроллер</text><rect x="24" y="155" width="272" height="48" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="32" y="185.0" font-family="Arial" font-size="17" fill="#193b53">Цель положения → драйвер</text><line x1="160" y1="135" x2="160" y2="155" stroke="#193b53" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="225" width="272" height="48" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="32" y="255.0" font-family="Arial" font-size="17" fill="#193b53">Мотор → заслонка</text><line x1="160" y1="205" x2="160" y2="225" stroke="#193b53" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="295" width="272" height="48" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="32" y="325.0" font-family="Arial" font-size="17" fill="#193b53">Датчик 0–5 V → HVAC</text><line x1="160" y1="275" x2="160" y2="295" stroke="#193b53" stroke-width="2" marker-end="url(#arrow)"/><text x="14" y="375" font-family="Arial" font-size="17" fill="#193b53">Здесь линейный датчик: 2,5 V —</text><text x="14" y="399" font-family="Arial" font-size="17" fill="#193b53">50% диапазона.</text><text x="14" y="429" font-family="Arial" font-size="17" fill="#193b53">Не универсальные 50% угла.</text><text x="14" y="459" font-family="Arial" font-size="17" fill="#193b53">Ступенчатый / LIN-привод —</text><text x="14" y="483" font-family="Arial" font-size="17" fill="#193b53">иные конструкции.</text></svg>