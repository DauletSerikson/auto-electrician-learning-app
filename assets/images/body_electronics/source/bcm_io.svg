<svg xmlns="http://www.w3.org/2000/svg" width="320" height="571" viewBox="0 0 320 571"><rect width="320" height="571" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">Входы ≠ силовые выходы</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#193b53"/></marker></defs><rect x="24" y="85" width="272" height="48" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="32" y="115.0" font-family="Arial" font-size="17" fill="#193b53">Контакт / 5-V датчик</text><rect x="24" y="155" width="272" height="48" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="32" y="185.0" font-family="Arial" font-size="17" fill="#193b53">Логический вход BCM</text><line x1="160" y1="135" x2="160" y2="155" stroke="#193b53" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="225" width="272" height="48" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="32" y="255.0" font-family="Arial" font-size="17" fill="#193b53">Решение + защита</text><line x1="160" y1="205" x2="160" y2="225" stroke="#193b53" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="295" width="272" height="48" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="32" y="325.0" font-family="Arial" font-size="17" fill="#193b53">High-side / low-side</text><line x1="160" y1="275" x2="160" y2="295" stroke="#193b53" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="365" width="272" height="48" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="32" y="395.0" font-family="Arial" font-size="17" fill="#193b53">Лампа / реле / мотор</text><line x1="160" y1="345" x2="160" y2="365" stroke="#193b53" stroke-width="2" marker-end="url(#arrow)"/><text x="14" y="445" font-family="Arial" font-size="17" fill="#193b53">High-side: B+→ключ→нагрузка→N.</text><text x="14" y="475" font-family="Arial" font-size="17" fill="#193b53">Low-side: B+→нагрузка→ключ→N.</text><text x="14" y="505" font-family="Arial" font-size="17" fill="#193b53">Допустимость входа задаёт</text><text x="14" y="529" font-family="Arial" font-size="17" fill="#193b53">документация.</text></svg>