<svg xmlns="http://www.w3.org/2000/svg" width="320" height="684" viewBox="0 0 320 684"><rect width="320" height="684" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">P0 • математическая петля</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><g id="card-0" data-u="360" data-r="120" data-c="0.002" data-initial="0"><rect x="14" y="100" width="292" height="124" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="126" font-family="Arial" font-size="18" fill="#193b53">Источник → R → C</text><text x="24" y="152" font-family="Arial" font-size="17" fill="#193b53">U=360 V, R=120 Ω</text><text x="24" y="178" font-family="Arial" font-size="17" fill="#193b53">C=2,00 mF; Uc(0)=0</text><text x="24" y="204" font-family="Arial" font-size="17" fill="#193b53">Возврат петли задан.</text></g><g id="card-1" ><rect x="14" y="248" width="292" height="124" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="274" font-family="Arial" font-size="18" fill="#193b53">Исходное состояние модели</text><text x="24" y="300" font-family="Arial" font-size="17" fill="#193b53">Главная ветвь не проводит.</text><text x="24" y="326" font-family="Arial" font-size="17" fill="#193b53">Нет нагрузки/утечки/ESR.</text><text x="24" y="352" font-family="Arial" font-size="17" fill="#193b53">Кузов не опора петли.</text></g><g id="card-2" ><rect x="14" y="396" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="422" font-family="Arial" font-size="18" fill="#193b53">Результат расчёта</text><text x="24" y="448" font-family="Arial" font-size="17" fill="#193b53">τ=0,24 s; EC∞=129,6 J</text><text x="24" y="474" font-family="Arial" font-size="17" fill="#193b53">Цель 90%: Uc≥324 V</text></g><text x="14" y="528" font-family="Arial" font-size="17" fill="#193b53">25 °C, SOC60%, E0.</text><text x="14" y="558" font-family="Arial" font-size="17" fill="#193b53">Не последовательность команд.</text><text x="14" y="588" font-family="Arial" font-size="17" fill="#193b53">Нет физических точек доступа.</text><text x="14" y="618" font-family="Arial" font-size="17" fill="#193b53">Нулевой параметр ≠</text><text x="14" y="642" font-family="Arial" font-size="17" fill="#193b53">безопасность.</text></svg>