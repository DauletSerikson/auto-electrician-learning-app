<svg xmlns="http://www.w3.org/2000/svg" width="320" height="572" viewBox="0 0 320 572"><rect width="320" height="572" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">HV/LV • границы понимания</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><g id="card-0" ><rect x="14" y="100" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="126" font-family="Arial" font-size="18" fill="#193b53">E0: тяговая сеть HV</text><text x="24" y="152" font-family="Arial" font-size="17" fill="#193b53">Отдельна от кузова.</text><text x="24" y="178" font-family="Arial" font-size="17" fill="#193b53">Энергия может сохраняться.</text></g><g id="card-1" ><rect x="14" y="222" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="248" font-family="Arial" font-size="18" fill="#193b53">E0: вспомогательная LV</text><text x="24" y="274" font-family="Arial" font-size="17" fill="#193b53">Условно номинальные 12 V.</text><text x="24" y="300" font-family="Arial" font-size="17" fill="#193b53">У других машин бывают иные.</text></g><g id="card-2" ><rect x="14" y="344" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="370" font-family="Arial" font-size="18" fill="#193b53">OFF ≠ допуск к работе</text><text x="24" y="396" font-family="Arial" font-size="17" fill="#193b53">Ни цвет, ни статус не</text><text x="24" y="422" font-family="Arial" font-size="17" fill="#193b53">подтверждают безопасность.</text></g><text x="14" y="476" font-family="Arial" font-size="17" fill="#193b53">Только готовые данные.</text><text x="14" y="506" font-family="Arial" font-size="17" fill="#193b53">Никаких физических HV-</text><text x="14" y="530" font-family="Arial" font-size="17" fill="#193b53">действий.</text></svg>