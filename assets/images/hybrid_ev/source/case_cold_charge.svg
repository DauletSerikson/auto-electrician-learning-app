<svg xmlns="http://www.w3.org/2000/svg" width="320" height="612" viewBox="0 0 320 612"><rect width="320" height="612" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">K2 • порт ≠ батарея</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><g id="card-0" data-v="360" data-current="10" data-heater="2000" data-port="5600"><rect x="14" y="100" width="292" height="150" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="126" font-family="Arial" font-size="18" fill="#193b53">Холодный кадр</text><text x="24" y="152" font-family="Arial" font-size="17" fill="#193b53">Tmin/max=−12/−8 °C; SOC40%</text><text x="24" y="178" font-family="Arial" font-size="17" fill="#193b53">360 V; в батарею 10 A</text><text x="24" y="204" font-family="Arial" font-size="17" fill="#193b53">Pbat=3,6; heater=2 kW</text><text x="24" y="230" font-family="Arial" font-size="17" fill="#193b53">Порт=5,6 kW</text></g><g id="card-1" data-v="360" data-current="100" data-heater="0" data-port="36000"><rect x="14" y="274" width="292" height="124" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="300" font-family="Arial" font-size="18" fill="#193b53">Тёплый кадр</text><text x="24" y="326" font-family="Arial" font-size="17" fill="#193b53">15/18 °C; SOC42%; 360 V</text><text x="24" y="352" font-family="Arial" font-size="17" fill="#193b53">В батарею 100 A → 36 kW</text><text x="24" y="378" font-family="Arial" font-size="17" fill="#193b53">heater=0; порт=36 kW</text></g><text x="14" y="432" font-family="Arial" font-size="17" fill="#193b53">Rated 150, доступно 60 kW.</text><text x="14" y="462" font-family="Arial" font-size="17" fill="#193b53">Потери/прочие расходы</text><text x="14" y="486" font-family="Arial" font-size="17" fill="#193b53">исключены.</text><text x="14" y="516" font-family="Arial" font-size="17" fill="#193b53">Кадры не задают длительность.</text><text x="14" y="546" font-family="Arial" font-size="17" fill="#193b53">Cold-limit по отчёту, не</text><text x="14" y="570" font-family="Arial" font-size="17" fill="#193b53">диагноз.</text></svg>