<svg xmlns="http://www.w3.org/2000/svg" width="320" height="602" viewBox="0 0 320 602"><rect width="320" height="602" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">E0 • функциональные связи</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><g id="card-0" ><rect x="14" y="100" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="126" font-family="Arial" font-size="18" fill="#193b53">Тяговая энергия</text><text x="24" y="152" font-family="Arial" font-size="17" fill="#193b53">HV батарея ↔ inverter</text><text x="24" y="178" font-family="Arial" font-size="17" fill="#193b53">Inverter ↔ motor ↔ колёса</text></g><g id="card-1" ><rect x="14" y="222" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="248" font-family="Arial" font-size="18" fill="#193b53">Вспомогательная сеть</text><text x="24" y="274" font-family="Arial" font-size="17" fill="#193b53">HV → изолированный DC/DC</text><text x="24" y="300" font-family="Arial" font-size="17" fill="#193b53">DC/DC → LV и вспом. АКБ</text></g><g id="card-2" ><rect x="14" y="344" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="370" font-family="Arial" font-size="18" fill="#193b53">Зарядка / данные</text><text x="24" y="396" font-family="Arial" font-size="17" fill="#193b53">AC → OBC → батарея</text><text x="24" y="422" font-family="Arial" font-size="17" fill="#193b53">BMS ↔ контроллеры: данные</text></g><text x="14" y="476" font-family="Arial" font-size="17" fill="#193b53">Механика: motor ↔ колёса.</text><text x="14" y="506" font-family="Arial" font-size="17" fill="#193b53">Прочие пути подписаны</text><text x="14" y="530" font-family="Arial" font-size="17" fill="#193b53">отдельно.</text><text x="14" y="560" font-family="Arial" font-size="17" fill="#193b53">HV− не соединён с кузовом E0.</text></svg>