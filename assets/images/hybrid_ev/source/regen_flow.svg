<svg xmlns="http://www.w3.org/2000/svg" width="320" height="514" viewBox="0 0 320 514"><rect width="320" height="514" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">M1 • рекуперация</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><g id="flow-0" data-power="20000"><rect x="20" y="100" width="280" height="50" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="28" y="131.0" font-family="Arial" font-size="17" fill="#193b53">Вал отдаёт 20 kW</text></g><line x1="160" y1="150" x2="160" y2="176" stroke="#193b53" stroke-width="2" /><path d="M155,170 L165,170 L160,180 Z" fill="#193b53"/><g id="flow-1" data-power="18000"><rect x="20" y="186" width="280" height="50" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="28" y="217.0" font-family="Arial" font-size="17" fill="#193b53">AC: 18 kW</text></g><line x1="160" y1="236" x2="160" y2="262" stroke="#193b53" stroke-width="2" /><path d="M155,256 L165,256 L160,266 Z" fill="#193b53"/><g id="flow-2" data-power="17280"><rect x="20" y="272" width="280" height="50" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="28" y="303.0" font-family="Arial" font-size="17" fill="#193b53">В батарею: 17,28 kW</text></g><text x="14" y="358" font-family="Arial" font-size="17" fill="#193b53">25 °C, 3000 rpm, 360 V.</text><text x="14" y="388" font-family="Arial" font-size="17" fill="#193b53">КПД отдельно заданы 0,90/0,96.</text><text x="14" y="418" font-family="Arial" font-size="17" fill="#193b53">Зарядный ток по модулю 48 A.</text><text x="14" y="448" font-family="Arial" font-size="17" fill="#193b53">Ограничения приёма</text><text x="14" y="472" font-family="Arial" font-size="17" fill="#193b53">сохраняются.</text></svg>