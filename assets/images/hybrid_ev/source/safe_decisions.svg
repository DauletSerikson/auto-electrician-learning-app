<svg xmlns="http://www.w3.org/2000/svg" width="320" height="652" viewBox="0 0 320 652"><rect width="320" height="652" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">Допустимые действия ученика</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><g id="card-0" ><rect x="14" y="100" width="292" height="124" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="126" font-family="Arial" font-size="18" fill="#193b53">Можно</text><text x="24" y="152" font-family="Arial" font-size="17" fill="#193b53">Читать готовый отчёт.</text><text x="24" y="178" font-family="Arial" font-size="17" fill="#193b53">Считать условную модель.</text><text x="24" y="204" font-family="Arial" font-size="17" fill="#193b53">Назвать недостающие данные.</text></g><g id="card-1" ><rect x="14" y="248" width="292" height="150" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="274" font-family="Arial" font-size="18" fill="#193b53">Граница</text><text x="24" y="300" font-family="Arial" font-size="17" fill="#193b53">Не выполнять HV-действия.</text><text x="24" y="326" font-family="Arial" font-size="17" fill="#193b53">Не маскировать защитный</text><text x="24" y="352" font-family="Arial" font-size="17" fill="#193b53">статус.</text><text x="24" y="378" font-family="Arial" font-size="17" fill="#193b53">Передать специалисту.</text></g><g id="card-2" ><rect x="14" y="422" width="292" height="124" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="448" font-family="Arial" font-size="18" fill="#193b53">Опасное состояние</text><text x="24" y="474" font-family="Arial" font-size="17" fill="#193b53">Прекратить взаимодействие.</text><text x="24" y="500" font-family="Arial" font-size="17" fill="#193b53">Обратиться к службам по</text><text x="24" y="526" font-family="Arial" font-size="17" fill="#193b53">ситуации.</text></g><text x="14" y="580" font-family="Arial" font-size="17" fill="#193b53">OFF не означает безопасность.</text><text x="14" y="610" font-family="Arial" font-size="17" fill="#193b53">Обучение не даёт допуска к HV.</text></svg>