<svg xmlns="http://www.w3.org/2000/svg" width="320" height="702" viewBox="0 0 320 702"><rect width="320" height="702" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">T0 • поток тепла</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><g id="card-0" data-tin="35" data-tout="40" data-flow="0.1" data-cp="3500"><rect x="14" y="100" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="126" font-family="Arial" font-size="18" fill="#193b53">Выбранный жидкостный контур</text><text x="24" y="152" font-family="Arial" font-size="17" fill="#193b53">Вход 35 °C → выход 40 °C</text><text x="24" y="178" font-family="Arial" font-size="17" fill="#193b53">ṁ=0,10 kg/s; cp=3500 J/kg/K</text></g><g id="card-1" ><rect x="14" y="222" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="248" font-family="Arial" font-size="18" fill="#193b53">Перенос тепла</text><text x="24" y="274" font-family="Arial" font-size="17" fill="#193b53">Q̇=1,75 kW; за 10 s 17,5 kJ</text><text x="24" y="300" font-family="Arial" font-size="17" fill="#193b53">Не потребление насоса.</text></g><g id="card-2" ><rect x="14" y="344" width="292" height="150" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="370" font-family="Arial" font-size="18" fill="#193b53">Варианты архитектуры</text><text x="24" y="396" font-family="Arial" font-size="17" fill="#193b53">Батарея / inverter / motor</text><text x="24" y="422" font-family="Arial" font-size="17" fill="#193b53">Разные контуры/теплообменники</text><text x="24" y="448" font-family="Arial" font-size="17" fill="#193b53">Тепловой насос — один</text><text x="24" y="474" font-family="Arial" font-size="17" fill="#193b53">вариант.</text></g><text x="14" y="528" font-family="Arial" font-size="17" fill="#193b53">Стационарно, без фазового</text><text x="14" y="552" font-family="Arial" font-size="17" fill="#193b53">перехода.</text><text x="14" y="582" font-family="Arial" font-size="17" fill="#193b53">Теплообмен ≠ смешение</text><text x="14" y="606" font-family="Arial" font-size="17" fill="#193b53">жидкостей.</text><text x="14" y="636" font-family="Arial" font-size="17" fill="#193b53">Без вмешательства в</text><text x="14" y="660" font-family="Arial" font-size="17" fill="#193b53">оборудование.</text></svg>