<svg xmlns="http://www.w3.org/2000/svg" width="320" height="686" viewBox="0 0 320 686"><rect width="320" height="686" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">K5 • тепловое ограничение</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><g id="card-0" data-u="360" data-i="100" data-shaft="31104" data-tinv="65" data-rpm="3000"><rect x="14" y="100" width="292" height="150" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="126" font-family="Arial" font-size="18" fill="#193b53">Сравнительный кадр</text><text x="24" y="152" font-family="Arial" font-size="17" fill="#193b53">360 V × 100 A → 36 kW DC</text><text x="24" y="178" font-family="Arial" font-size="17" fill="#193b53">M1: вал 31,104 kW</text><text x="24" y="204" font-family="Arial" font-size="17" fill="#193b53">Tinv/motor/bat=65/60/25 °C</text><text x="24" y="230" font-family="Arial" font-size="17" fill="#193b53">Насос 80% / 3000 rpm</text></g><g id="card-1" data-u="360" data-i="50" data-shaft="15552" data-tinv="110" data-rpm="0"><rect x="14" y="274" width="292" height="150" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="300" font-family="Arial" font-size="18" fill="#193b53">Кадр ограничения</text><text x="24" y="326" font-family="Arial" font-size="17" fill="#193b53">360 V × 50 A → 18 kW DC</text><text x="24" y="352" font-family="Arial" font-size="17" fill="#193b53">M1: вал 15,552 kW</text><text x="24" y="378" font-family="Arial" font-size="17" fill="#193b53">Tinv/motor/bat=110/75/30 °C</text><text x="24" y="404" font-family="Arial" font-size="17" fill="#193b53">Насос 80% / 0 rpm</text></g><text x="14" y="458" font-family="Arial" font-size="17" fill="#193b53">Оба: вал3000 rpm, LV14 V,</text><text x="14" y="482" font-family="Arial" font-size="17" fill="#193b53">SOC60%.</text><text x="14" y="512" font-family="Arial" font-size="17" fill="#193b53">I относится к inverter, не</text><text x="14" y="536" font-family="Arial" font-size="17" fill="#193b53">пакету.</text><text x="14" y="566" font-family="Arial" font-size="17" fill="#193b53">Температура по отчёту, не OEM-</text><text x="14" y="590" font-family="Arial" font-size="17" fill="#193b53">порог.</text><text x="14" y="620" font-family="Arial" font-size="17" fill="#193b53">Расход неизвестен; деталь не</text><text x="14" y="644" font-family="Arial" font-size="17" fill="#193b53">найдена.</text></svg>