<svg xmlns="http://www.w3.org/2000/svg" width="320" height="532" viewBox="0 0 320 532"><rect width="320" height="532" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">C0 • разные пути зарядки</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><g id="card-0" data-vrms="230" data-irms="16" data-pf="1" data-eta="0.9"><rect x="14" y="100" width="292" height="124" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="126" font-family="Arial" font-size="18" fill="#193b53">AC: EVSE → OBC</text><text x="24" y="152" font-family="Arial" font-size="17" fill="#193b53">230 V RMS; 16 A; cosφ=1</text><text x="24" y="178" font-family="Arial" font-size="17" fill="#193b53">3,68 kW AC → 3,312 kW DC</text><text x="24" y="204" font-family="Arial" font-size="17" fill="#193b53">OBC η=0,90; батарея 360 V</text></g><g id="card-1" ><rect x="14" y="248" width="292" height="124" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="274" font-family="Arial" font-size="18" fill="#193b53">DC: внешнее преобразование</text><text x="24" y="300" font-family="Arial" font-size="17" fill="#193b53">DC-порт → HV-батарея</text><text x="24" y="326" font-family="Arial" font-size="17" fill="#193b53">Минуется AC/DC-каскад OBC,</text><text x="24" y="352" font-family="Arial" font-size="17" fill="#193b53">защиты и разрешения остаются.</text></g><text x="14" y="406" font-family="Arial" font-size="17" fill="#193b53">E0, 25 °C, SOC40%.</text><text x="14" y="436" font-family="Arial" font-size="17" fill="#193b53">Другие расходы в C0 исключены.</text><text x="14" y="466" font-family="Arial" font-size="17" fill="#193b53">Тип разъёма зависит от</text><text x="14" y="490" font-family="Arial" font-size="17" fill="#193b53">региона.</text></svg>