<svg xmlns="http://www.w3.org/2000/svg" width="320" height="602" viewBox="0 0 320 602"><rect width="320" height="602" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">B0 • 96s2p, 25 °C</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><g id="card-0" data-cellv="3.75" data-cellah="50"><rect x="14" y="100" width="292" height="72" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="126" font-family="Arial" font-size="18" fill="#193b53">Одна ячейка</text><text x="24" y="152" font-family="Arial" font-size="17" fill="#193b53">Номинально 3,75 V / 50 Ah</text></g><g id="card-1" data-parallel="2"><rect x="14" y="196" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="222" font-family="Arial" font-size="18" fill="#193b53">Одна группа 2p</text><text x="24" y="248" font-family="Arial" font-size="17" fill="#193b53">2 параллельные ячейки</text><text x="24" y="274" font-family="Arial" font-size="17" fill="#193b53">3,75 V / 100 Ah</text></g><g id="card-2" data-series="96"><rect x="14" y="318" width="292" height="124" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="344" font-family="Arial" font-size="18" fill="#193b53">96 групп последовательно</text><text x="24" y="370" font-family="Arial" font-size="17" fill="#193b53">192 ячейки всего</text><text x="24" y="396" font-family="Arial" font-size="17" fill="#193b53">360 V / 100 Ah / 36 kWh</text><text x="24" y="422" font-family="Arial" font-size="17" fill="#193b53">BMS: 96 групповых напряжений</text></g><text x="14" y="476" font-family="Arial" font-size="17" fill="#193b53">Идентичные идеальные элементы.</text><text x="14" y="506" font-family="Arial" font-size="17" fill="#193b53">При покое I=0, P=0.</text><text x="14" y="536" font-family="Arial" font-size="17" fill="#193b53">Номинальная энергия ≠</text><text x="14" y="560" font-family="Arial" font-size="17" fill="#193b53">доступная.</text></svg>