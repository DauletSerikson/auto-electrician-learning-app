<svg xmlns="http://www.w3.org/2000/svg" width="320" height="598" viewBox="0 0 320 598"><rect width="320" height="598" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">Гибрид: разные пути</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><g id="card-0" ><rect x="14" y="100" width="292" height="124" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="126" font-family="Arial" font-size="18" fill="#193b53">Последовательный</text><text x="24" y="152" font-family="Arial" font-size="17" fill="#193b53">ДВС → генератор</text><text x="24" y="178" font-family="Arial" font-size="17" fill="#193b53">Электричество → мотор</text><text x="24" y="204" font-family="Arial" font-size="17" fill="#193b53">Механика мотора → колёса</text></g><g id="card-1" ><rect x="14" y="248" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="274" font-family="Arial" font-size="18" fill="#193b53">Параллельный</text><text x="24" y="300" font-family="Arial" font-size="17" fill="#193b53">ДВС → механика → колёса</text><text x="24" y="326" font-family="Arial" font-size="17" fill="#193b53">Мотор также участвует в тяге.</text></g><g id="card-2" ><rect x="14" y="370" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="396" font-family="Arial" font-size="18" fill="#193b53">Комбинированный</text><text x="24" y="422" font-family="Arial" font-size="17" fill="#193b53">Электрический и механический</text><text x="24" y="448" font-family="Arial" font-size="17" fill="#193b53">пути зависят от режима.</text></g><text x="14" y="502" font-family="Arial" font-size="17" fill="#193b53">Стрелки показывают энергию.</text><text x="14" y="532" font-family="Arial" font-size="17" fill="#193b53">Это не электрическая</text><text x="14" y="556" font-family="Arial" font-size="17" fill="#193b53">распиновка.</text></svg>