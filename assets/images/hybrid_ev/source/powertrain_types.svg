<svg xmlns="http://www.w3.org/2000/svg" width="320" height="696" viewBox="0 0 320 696"><rect width="320" height="696" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">Четыре силовые установки</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><g id="card-0" ><rect x="14" y="100" width="292" height="124" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="126" font-family="Arial" font-size="18" fill="#193b53">ДВС</text><text x="24" y="152" font-family="Arial" font-size="17" fill="#193b53">Топливо → двигатель → колёса</text><text x="24" y="178" font-family="Arial" font-size="17" fill="#193b53">В E0 такой двигатель</text><text x="24" y="204" font-family="Arial" font-size="17" fill="#193b53">отсутствует.</text></g><g id="card-1" ><rect x="14" y="248" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="274" font-family="Arial" font-size="18" fill="#193b53">HEV</text><text x="24" y="300" font-family="Arial" font-size="17" fill="#193b53">ДВС + электрическая тяга</text><text x="24" y="326" font-family="Arial" font-size="17" fill="#193b53">Нет внешней зарядки батареи.</text></g><g id="card-2" ><rect x="14" y="370" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="396" font-family="Arial" font-size="18" fill="#193b53">PHEV</text><text x="24" y="422" font-family="Arial" font-size="17" fill="#193b53">ДВС + электрическая тяга</text><text x="24" y="448" font-family="Arial" font-size="17" fill="#193b53">Есть внешняя зарядка.</text></g><g id="card-3" ><rect x="14" y="492" width="292" height="98" rx="6" fill="#eaf3f9" stroke="#193b53"/><text x="24" y="518" font-family="Arial" font-size="18" fill="#193b53">BEV</text><text x="24" y="544" font-family="Arial" font-size="17" fill="#193b53">Батарея + электромотор</text><text x="24" y="570" font-family="Arial" font-size="17" fill="#193b53">Без тягового ДВС.</text></g><text x="14" y="624" font-family="Arial" font-size="17" fill="#193b53">Это классификация источников.</text><text x="14" y="654" font-family="Arial" font-size="17" fill="#193b53">Режимы зависят от реализации.</text></svg>