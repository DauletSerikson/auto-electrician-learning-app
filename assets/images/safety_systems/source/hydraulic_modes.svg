<svg xmlns="http://www.w3.org/2000/svg" width="320" height="970" viewBox="0 0 320 970"><rect width="320" height="970" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">H1 • фазы модуляции</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><g id="hydraulic-0" data-inlet="open" data-outlet="closed"><text x="14" y="110" font-family="Arial" font-size="19" fill="#193b53">Нарастание</text><text x="14" y="142" font-family="Arial" font-size="17" fill="#193b53">M → VI → W → VO → R</text><line x1="25" y1="185" x2="295" y2="185" stroke="#193b53" stroke-width="2" /><rect x="65" y="167" width="65" height="36" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="73" y="191.0" font-family="Arial" font-size="17" fill="#193b53">VI</text><rect x="187" y="167" width="65" height="36" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="195" y="191.0" font-family="Arial" font-size="17" fill="#193b53">VO</text><text x="60" y="229" font-family="Arial" font-size="16" fill="#193b53">открыт</text><text x="182" y="229" font-family="Arial" font-size="16" fill="#193b53">закрыт</text><line x1="219" y1="167" x2="219" y2="203" stroke="#ad392f" stroke-width="2" /></g><g id="hydraulic-1" data-inlet="closed" data-outlet="closed"><text x="14" y="310" font-family="Arial" font-size="19" fill="#193b53">Удержание</text><text x="14" y="342" font-family="Arial" font-size="17" fill="#193b53">M → VI → W → VO → R</text><line x1="25" y1="385" x2="295" y2="385" stroke="#193b53" stroke-width="2" /><rect x="65" y="367" width="65" height="36" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="73" y="391.0" font-family="Arial" font-size="17" fill="#193b53">VI</text><rect x="187" y="367" width="65" height="36" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="195" y="391.0" font-family="Arial" font-size="17" fill="#193b53">VO</text><text x="60" y="429" font-family="Arial" font-size="16" fill="#193b53">закрыт</text><text x="182" y="429" font-family="Arial" font-size="16" fill="#193b53">закрыт</text><line x1="97" y1="367" x2="97" y2="403" stroke="#ad392f" stroke-width="2" /><line x1="219" y1="367" x2="219" y2="403" stroke="#ad392f" stroke-width="2" /></g><g id="hydraulic-2" data-inlet="closed" data-outlet="open"><text x="14" y="510" font-family="Arial" font-size="19" fill="#193b53">Уменьшение</text><text x="14" y="542" font-family="Arial" font-size="17" fill="#193b53">M → VI → W → VO → R</text><line x1="25" y1="585" x2="295" y2="585" stroke="#193b53" stroke-width="2" /><rect x="65" y="567" width="65" height="36" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="73" y="591.0" font-family="Arial" font-size="17" fill="#193b53">VI</text><rect x="187" y="567" width="65" height="36" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="195" y="591.0" font-family="Arial" font-size="17" fill="#193b53">VO</text><text x="60" y="629" font-family="Arial" font-size="16" fill="#193b53">закрыт</text><text x="182" y="629" font-family="Arial" font-size="16" fill="#193b53">открыт</text><line x1="97" y1="567" x2="97" y2="603" stroke="#ad392f" stroke-width="2" /></g><text x="14" y="730" font-family="Arial" font-size="17" fill="#193b53">M — источник давления.</text><text x="14" y="760" font-family="Arial" font-size="17" fill="#193b53">W — колёсный объём.</text><text x="14" y="790" font-family="Arial" font-size="17" fill="#193b53">R — аккумулятор низкого</text><text x="14" y="814" font-family="Arial" font-size="17" fill="#193b53">давления.</text><text x="14" y="844" font-family="Arial" font-size="17" fill="#193b53">Возвратный насос: R → M.</text><text x="14" y="874" font-family="Arial" font-size="17" fill="#193b53">Нет слива наружу.</text><text x="14" y="904" font-family="Arial" font-size="17" fill="#193b53">Состояние насоса задаёт</text><text x="14" y="928" font-family="Arial" font-size="17" fill="#193b53">контроллер, не эта таблица.</text></svg>