<svg xmlns="http://www.w3.org/2000/svg" width="320" height="719" viewBox="0 0 320 719"><rect width="320" height="719" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">K5 • только сообщения</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><rect x="20" y="105" width="280" height="48" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="28" y="135.0" font-family="Arial" font-size="17" fill="#193b53">Готовый отчёт специалиста</text><text x="18" y="205" font-family="Arial" font-size="17" fill="#193b53">A: после ДТП</text><text x="18" y="238" font-family="Arial" font-size="17" fill="#193b53">Запись события присутствует.</text><text x="18" y="271" font-family="Arial" font-size="17" fill="#193b53">Есть текущая неисправность.</text><text x="18" y="333" font-family="Arial" font-size="17" fill="#193b53">B: после работ салона</text><text x="18" y="366" font-family="Arial" font-size="17" fill="#193b53">Occupant information:</text><text x="18" y="399" font-family="Arial" font-size="17" fill="#193b53">текущая неисправность.</text><text x="14" y="455" font-family="Arial" font-size="17" fill="#193b53">Лампа fault остаётся ON.</text><text x="14" y="485" font-family="Arial" font-size="17" fill="#193b53">Passenger status не</text><text x="14" y="509" font-family="Arial" font-size="17" fill="#193b53">подтверждён.</text><text x="14" y="539" font-family="Arial" font-size="17" fill="#193b53">Состояние компонентов</text><text x="14" y="563" font-family="Arial" font-size="17" fill="#193b53">неизвестно.</text><text x="14" y="593" font-family="Arial" font-size="17" fill="#193b53">Сохранить контекст/отчёт.</text><text x="14" y="623" font-family="Arial" font-size="17" fill="#193b53">OEM-оценка специалистом.</text><text x="14" y="653" font-family="Arial" font-size="17" fill="#193b53">Никаких измерений и reset ради</text><text x="14" y="677" font-family="Arial" font-size="17" fill="#193b53">погасшей лампы.</text></svg>