<svg xmlns="http://www.w3.org/2000/svg" width="320" height="492" viewBox="0 0 320 492"><rect width="320" height="492" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">K3 • противоречие данных</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><text x="14" y="105" font-family="Arial" font-size="18" fill="#193b53">K3 • цифровые параметры</text><text x="14" y="139" font-family="Arial" font-size="15" fill="#193b53">режим</text><text x="80" y="139" font-family="Arial" font-size="15" fill="#193b53">v</text><text x="140" y="139" font-family="Arial" font-size="15" fill="#193b53">δSW</text><text x="200" y="139" font-family="Arial" font-size="15" fill="#193b53">r</text><text x="260" y="139" font-family="Arial" font-size="15" fill="#193b53">ay</text><g id="esc-record-0" data-v="0" data-steering="0" data-yaw="6" data-ay="0"><text x="14" y="173" font-family="Arial" font-size="15" fill="#193b53">покой</text><text x="80" y="173" font-family="Arial" font-size="15" fill="#193b53">0</text><text x="140" y="173" font-family="Arial" font-size="15" fill="#193b53">0</text><text x="200" y="173" font-family="Arial" font-size="15" fill="#193b53">6</text><text x="260" y="173" font-family="Arial" font-size="15" fill="#193b53">0</text></g><g id="esc-record-1" data-v="36" data-steering="30" data-yaw="17.46" data-ay="2"><text x="14" y="207" font-family="Arial" font-size="15" fill="#193b53">влево</text><text x="80" y="207" font-family="Arial" font-size="15" fill="#193b53">36</text><text x="140" y="207" font-family="Arial" font-size="15" fill="#193b53">30</text><text x="200" y="207" font-family="Arial" font-size="15" fill="#193b53">17,46</text><text x="260" y="207" font-family="Arial" font-size="15" fill="#193b53">2</text></g><text x="14" y="252" font-family="Arial" font-size="17" fill="#193b53">v: km/h; δSW: °; r: deg/s.</text><text x="14" y="282" font-family="Arial" font-size="17" fill="#193b53">ay: m/s²; ax=0.</text><text x="14" y="312" font-family="Arial" font-size="17" fill="#193b53">Общие метки, valid=true.</text><text x="14" y="342" font-family="Arial" font-size="17" fill="#193b53">Калибровка не подтверждена.</text><text x="14" y="372" font-family="Arial" font-size="17" fill="#193b53">Покой не согласуется с +6</text><text x="14" y="396" font-family="Arial" font-size="17" fill="#193b53">deg/s.</text><text x="14" y="426" font-family="Arial" font-size="17" fill="#193b53">Корреляция не называет</text><text x="14" y="450" font-family="Arial" font-size="17" fill="#193b53">неисправную деталь.</text></svg>