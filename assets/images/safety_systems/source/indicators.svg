<svg xmlns="http://www.w3.org/2000/svg" width="320" height="665" viewBox="0 0 320 665"><rect width="320" height="665" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">Разные индикаторы</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><rect x="20" y="105" width="280" height="100" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="28" y="161.0" font-family="Arial" font-size="17" fill="#193b53">Fault / readiness</text><text x="30" y="244" font-family="Arial" font-size="17" fill="#193b53">Сообщает о неисправности</text><rect x="20" y="295" width="280" height="100" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="28" y="351.0" font-family="Arial" font-size="17" fill="#193b53">Passenger status</text><text x="30" y="434" font-family="Arial" font-size="17" fill="#193b53">Сообщает статус пассажира</text><text x="14" y="485" font-family="Arial" font-size="17" fill="#193b53">Это условные карточки.</text><text x="14" y="515" font-family="Arial" font-size="17" fill="#193b53">Не универсальные символы,</text><text x="14" y="539" font-family="Arial" font-size="17" fill="#193b53">цвета или тайминги.</text><text x="14" y="569" font-family="Arial" font-size="17" fill="#193b53">Нужен owner manual.</text><text x="14" y="599" font-family="Arial" font-size="17" fill="#193b53">Погасшая лампа не проверяет</text><text x="14" y="623" font-family="Arial" font-size="17" fill="#193b53">все механические узлы.</text></svg>