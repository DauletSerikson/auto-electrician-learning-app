<svg xmlns="http://www.w3.org/2000/svg" width="320" height="575" viewBox="0 0 320 575"><rect width="320" height="575" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">K2 • события и обороты</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><text x="14" y="105" font-family="Arial" font-size="17" fill="#193b53">25 оборотов, ECU ждёт Z=48</text><text x="14" y="165" font-family="Arial" font-size="17" fill="#193b53">до</text><rect id="events-до" data-count="1200" x="65" y="143" width="225.0" height="35" fill="#aacbdc"/><text x="85" y="170" font-family="Arial" font-size="17" fill="#193b53">1200</text><text x="14" y="275" font-family="Arial" font-size="17" fill="#193b53">после</text><rect id="events-после" data-count="1100" x="65" y="253" width="206.25" height="35" fill="#aacbdc"/><text x="85" y="280" font-family="Arial" font-size="17" fill="#193b53">1100</text><text x="14" y="365" font-family="Arial" font-size="17" fill="#193b53">После: 1100/25=44 событий.</text><text x="14" y="395" font-family="Arial" font-size="17" fill="#193b53">Это эффективное число, не</text><text x="14" y="419" font-family="Arial" font-size="17" fill="#193b53">доказанные 44 пары кольца.</text><text x="14" y="449" font-family="Arial" font-size="17" fill="#193b53">6 s: 183,333 Hz → 27,5 km/h.</text><text x="14" y="479" font-family="Arial" font-size="17" fill="#193b53">12 s: 91,667 Hz → 13,75 km/h.</text><text x="14" y="509" font-family="Arial" font-size="17" fill="#193b53">Нужно различить детали,</text><text x="14" y="533" font-family="Arial" font-size="17" fill="#193b53">монтаж, пропуски и обработку.</text></svg>