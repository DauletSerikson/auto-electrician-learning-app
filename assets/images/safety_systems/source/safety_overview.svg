<svg xmlns="http://www.w3.org/2000/svg" width="320" height="635" viewBox="0 0 320 635"><rect width="320" height="635" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">Безопасность: разные роли</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><text x="14" y="105" font-family="Arial" font-size="19" fill="#193b53">Активная безопасность</text><rect x="20" y="125" width="280" height="52" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="28" y="157.0" font-family="Arial" font-size="17" fill="#193b53">ABS / ESC</text><text x="22" y="210" font-family="Arial" font-size="17" fill="#193b53">Помощь управлению</text><text x="22" y="238" font-family="Arial" font-size="17" fill="#193b53">до столкновения.</text><text x="14" y="300" font-family="Arial" font-size="19" fill="#193b53">Пассивная безопасность</text><rect x="20" y="320" width="280" height="52" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="28" y="352.0" font-family="Arial" font-size="17" fill="#193b53">Ремни / SRS</text><text x="22" y="405" font-family="Arial" font-size="17" fill="#193b53">Снижение последствий</text><text x="22" y="433" font-family="Arial" font-size="17" fill="#193b53">при столкновении.</text><text x="14" y="485" font-family="Arial" font-size="17" fill="#193b53">SRS дополняет ремень.</text><text x="14" y="515" font-family="Arial" font-size="17" fill="#193b53">Электроника связана с</text><text x="14" y="539" font-family="Arial" font-size="17" fill="#193b53">механикой/гидравликой.</text><text x="14" y="569" font-family="Arial" font-size="17" fill="#193b53">Нет гарантии защиты при любых</text><text x="14" y="593" font-family="Arial" font-size="17" fill="#193b53">условиях.</text></svg>