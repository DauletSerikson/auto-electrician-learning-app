<svg xmlns="http://www.w3.org/2000/svg" width="320" height="650" viewBox="0 0 320 650"><rect width="320" height="650" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">E1 • оси и единицы</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><rect x="130" y="130" width="60" height="110" rx="5" fill="#e0eef6" stroke="#193b53"/><text x="138" y="191.0" font-family="Arial" font-size="17" fill="#193b53"></text><text x="149" y="188" font-family="Arial" font-size="14" fill="#193b53">авто</text><line x1="160" y1="130" x2="160" y2="100" stroke="#193b53" stroke-width="2" /><text x="175" y="110" font-family="Arial" font-size="17" fill="#193b53">x вперёд</text><line x1="130" y1="185" x2="35" y2="185" stroke="#193b53" stroke-width="2" /><text x="14" y="165" font-family="Arial" font-size="17" fill="#193b53">y влево</text><text x="16" y="285" font-family="Arial" font-size="17" fill="#193b53">z вверх; +r — влево</text><text x="16" y="330" font-family="Arial" font-size="17" fill="#193b53">δSW — угол руля, не колеса</text><text x="16" y="375" font-family="Arial" font-size="17" fill="#193b53">E1: 36 km/h = 10 m/s</text><text x="16" y="410" font-family="Arial" font-size="17" fill="#193b53">r=0,20 rad/s=11,46 deg/s</text><text x="16" y="445" font-family="Arial" font-size="17" fill="#193b53">ay≈v·r=2,00 m/s²</text><text x="14" y="500" font-family="Arial" font-size="17" fill="#193b53">Плоский установившийся режим</text><text x="14" y="524" font-family="Arial" font-size="17" fill="#193b53">без бокового slip.</text><text x="14" y="554" font-family="Arial" font-size="17" fill="#193b53">Не диагностический порог.</text><text x="14" y="584" font-family="Arial" font-size="17" fill="#193b53">У другого ECU знаки/оси могут</text><text x="14" y="608" font-family="Arial" font-size="17" fill="#193b53">быть иными.</text></svg>