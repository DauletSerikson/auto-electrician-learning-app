<svg xmlns="http://www.w3.org/2000/svg" width="320" height="703" viewBox="0 0 320 703"><rect width="320" height="703" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">Питание ≠ связь</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><rect x="20" y="105" width="280" height="55" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="28" y="138.5" font-family="Arial" font-size="17" fill="#193b53">B+ → F → логика ABS</text><rect x="20" y="195" width="280" height="55" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="28" y="228.5" font-family="Arial" font-size="17" fill="#193b53">G → N: обратный путь</text><rect x="20" y="285" width="280" height="55" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="28" y="318.5" font-family="Arial" font-size="17" fill="#193b53">CAN ↔ другие ECU</text><rect x="20" y="375" width="280" height="55" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="28" y="408.5" font-family="Arial" font-size="17" fill="#193b53">Сообщение ≠ действие</text><text x="14" y="475" font-family="Arial" font-size="17" fill="#193b53">Карточки показывают разные</text><text x="14" y="499" font-family="Arial" font-size="17" fill="#193b53">пути.</text><text x="14" y="529" font-family="Arial" font-size="17" fill="#193b53">Силовые ветви насоса/клапанов</text><text x="14" y="553" font-family="Arial" font-size="17" fill="#193b53">отдельны по схеме.</text><text x="14" y="583" font-family="Arial" font-size="17" fill="#193b53">Потеря связи не доказывает</text><text x="14" y="607" font-family="Arial" font-size="17" fill="#193b53">отказ CAN.</text><text x="14" y="637" font-family="Arial" font-size="17" fill="#193b53">Без pinout и принудительного</text><text x="14" y="661" font-family="Arial" font-size="17" fill="#193b53">включения.</text></svg>