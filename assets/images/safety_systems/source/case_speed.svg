d="true"><text x="14" y="309" font-family="Arial" font-size="15" fill="#193b53">0,4</text><text x="80" y="309" font-family="Arial" font-size="15" fill="#193b53">30</text><text x="140" y="309" font-family="Arial" font-size="15" fill="#193b53">valid</text></g><text x="14" y="354" font-family="Arial" font-size="17" fill="#193b53">*0 — placeholder, не</text><text x="14" y="378" font-family="Arial" font-size="17" fill="#193b53">остановка.</text><text x="14" y="408" font-family="Arial" font-size="17" fill="#193b53">Прямо 30 km/h, без slip.</text><text x="14" y="438" font-family="Arial" font-size="17" fill="#193b53">200–300 ms: ток постоянен 7</text><text x="14" y="462" font-family="Arial" font-size="17" fill="#193b53">mA; UR=0,7 V.</text><text x="14" y="492" font-family="Arial" font-size="17" fill="#193b53">Питание датчика 11,3 V.</text><text x="14" y="522" font-family="Arial" font-size="17" fill="#193b53">Причина и raw→data неизвестны.</text></svg>