<svg xmlns="http://www.w3.org/2000/svg" width="320" height="805" viewBox="0 0 320 805"><rect width="320" height="805" fill="white"/><text x="14" y="25" font-family="Arial" font-size="19" fill="#193b53">S0 • только функции SRS</text><text x="14" y="72" font-family="Arial" font-size="16" fill="#193b53">Авторская учебная схема</text><rect x="20" y="105" width="280" height="55" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="28" y="138.5" font-family="Arial" font-size="17" fill="#193b53">Данные события / пассажира</text><line x1="160" y1="160" x2="160" y2="195" stroke="#193b53" stroke-width="2" /><path d="M156,187 L164,187 L160,195 Z" fill="#193b53"/><rect x="20" y="195" width="280" height="55" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="28" y="228.5" font-family="Arial" font-size="17" fill="#193b53">SRS: оценка условий</text><line x1="160" y1="250" x2="160" y2="280" stroke="#193b53" stroke-width="2" /><line x1="85" y1="280" x2="235" y2="280" stroke="#193b53" stroke-width="2" /><line x1="85" y1="280" x2="85" y2="315" stroke="#193b53" stroke-width="2" /><path d="M81,307 L89,307 L85,315 Z" fill="#193b53"/><line x1="235" y1="280" x2="235" y2="415" stroke="#193b53" stroke-width="2" /><path d="M231,407 L239,407 L235,415 Z" fill="#193b53"/><rect x="15" y="315" width="140" height="65" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="23" y="353.5" font-family="Arial" font-size="17" fill="#193b53">Защита</text><rect x="165" y="415" width="140" height="65" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="173" y="453.5" font-family="Arial" font-size="17" fill="#193b53">Диагностика</text><rect x="15" y="525" width="290" height="55" rx="5" fill="#eaf3f9" stroke="#193b53"/><text x="23" y="558.5" font-family="Arial" font-size="17" fill="#193b53">Функция резерва энергии</text><text x="14" y="625" font-family="Arial" font-size="17" fill="#193b53">Это смысловые связи функций.</text><text x="14" y="655" font-family="Arial" font-size="17" fill="#193b53">Резерв относится к системе в</text><text x="14" y="679" font-family="Arial" font-size="17" fill="#193b53">целом.</text><text x="14" y="709" font-family="Arial" font-size="17" fill="#193b53">Подушки дополняют ремни.</text><text x="14" y="739" font-family="Arial" font-size="17" fill="#193b53">Нет проводов, точек</text><text x="14" y="763" font-family="Arial" font-size="17" fill="#193b53">подключения или процедур.</text></svg>