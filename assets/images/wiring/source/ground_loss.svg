<text x="118" y="432" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">N</text>
<circle cx="85" cy="449" r="4" fill="white" stroke="#172b3a" stroke-width="2"/>
<text x="110" y="455" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">B1−</text>
<line x1="85" y1="449" x2="85" y2="461" stroke="#172b3a" stroke-width="3" />
