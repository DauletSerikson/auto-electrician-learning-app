<circle cx="85" cy="325" r="5" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<text x="116" y="331" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">T</text>
<rect x="74" y="345" width="22" height="52" fill="white" stroke="#172b3a" stroke-width="3"/>
<text x="118" y="371" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">Rк = 0,3 Ω</text>
