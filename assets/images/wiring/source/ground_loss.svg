<text x="16" y="524" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">B1+ относительно N: 12,6 V</text>
<text x="16" y="552" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Rк — сопротивление контакта</text>
