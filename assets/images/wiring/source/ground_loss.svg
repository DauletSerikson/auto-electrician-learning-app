<svg xmlns="http://www.w3.org/2000/svg" width="320" height="608" viewBox="0 0 320 608">
<title>ground_loss</title>
<desc>Включённая H1 получает питание B1+ через F1. Обратный путь T через контакт Rк 0.3 Ω к N/B1−, точка G0 связана с N. Заданный измеренный ток 4 A; источник 12.6 V относительно N; потери плюсового пути нулевые в идеализированной задаче. T–N=1.2 V, на H1=11.4 V; Rк обозначает контакт, не штатный резистор.</desc>
