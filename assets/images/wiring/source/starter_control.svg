<svg xmlns="http://www.w3.org/2000/svg" width="320" height="634" viewBox="0 0 320 634">
<title>starter_control</title>
<desc>При разрешённом запросе START блок ECU возбуждает катушку K2, силовой контакт K2 30–87 замкнут. B1+ через F3, этот контакт, X3:1 и вывод 50 к упрощённому приводу K3; обратный путь через G3 к B1−. Катушка K2 внутри блока управления отдельно не нарисована. Обмотки втягивания/удержания K3 сведены к функциональному приводу, токи по этой схеме не рассчитываются.</desc>
<rect width="320" height="634" fill="white"/>
<text x="16" y="30" font-family="Arial" font-size="20" text-anchor="start" font-weight="bold" fill="#172b3a">Запуск · управляющий путь</text>
<text x="16" y="62" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Запрос START и разрешение P/N</text>
<circle cx="75" cy="100" r="4" fill="white" stroke="#172b3a" stroke-width="2"/>
