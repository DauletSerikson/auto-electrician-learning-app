<line x1="254" y1="180" x2="228" y2="217" stroke="#172b3a" stroke-width="3" />
<text x="210" y="210" font-family="Arial" font-size="18" text-anchor="end" font-weight="bold" fill="#172b3a">S1</text>
<line x1="254" y1="230" x2="254" y2="277" stroke="#172b3a" stroke-width="3" />
<circle cx="254" cy="300" r="23" fill="white" stroke="#172b3a" stroke-width="2" />
<line x1="238" y1="284" x2="270" y2="316" stroke="#172b3a" stroke-width="3" />
<line x1="238" y1="316" x2="270" y2="284" stroke="#172b3a" stroke-width="3" />
<text x="288" y="306" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a"></text>
<text x="212" y="306" font-family="Arial" font-size="18" text-anchor="end" font-weight="bold" fill="#172b3a">H1</text>
<line x1="254" y1="323" x2="254" y2="360" stroke="#172b3a" stroke-width="3" />
<line x1="254" y1="360" x2="58" y2="360" stroke="#172b3a" stroke-width="3" />
<line x1="58" y1="360" x2="58" y2="230" stroke="#172b3a" stroke-width="3" />
<line x1="28" y1="190" x2="88" y2="190" stroke="#172b3a" stroke-width="3" id="battery-positive-plate"/>
<line x1="43" y1="203" x2="73" y2="203" stroke="#172b3a" stroke-width="3" />
<line x1="28" y1="217" x2="88" y2="217" stroke="#172b3a" stroke-width="3" />
<line x1="43" y1="230" x2="73" y2="230" stroke="#172b3a" stroke-width="3" id="battery-negative-plate"/>
