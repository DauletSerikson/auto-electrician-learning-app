<svg xmlns="http://www.w3.org/2000/svg" width="320" height="476" viewBox="0 0 320 476">
<title>symbols_lamp</title>
<desc>Учебная 12 V цепь: положительный длинный штрих B1 через F1, разомкнутый S1 и H1 возвращается к отрицательному короткому штриху B1. Два показанных элемента — условное обозначение батареи, а не число её физических ячеек.</desc>
<rect width="320" height="476" fill="#ffffff"/>
