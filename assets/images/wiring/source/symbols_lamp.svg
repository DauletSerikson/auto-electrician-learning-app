<text x="16" y="274" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">B1</text>
<text x="16" y="398" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">F1 — предохранитель</text>
<text x="16" y="426" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">H1 — лампа; S1 — выключатель</text>
