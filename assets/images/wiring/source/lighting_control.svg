<svg xmlns="http://www.w3.org/2000/svg" width="320" height="576" viewBox="0 0 320 576">
<title>lighting_control</title>
<desc>B1+ через F2 и замкнутый S1 к катушке K1 86; 85 через G2/кузов к B1−. Защитный диод в данном учебном реле не предусмотрен. Катушка механически управляет контактом K1 на другом фрагменте; это не силовой путь лампы.</desc>
<rect width="320" height="576" fill="white"/>
<text x="16" y="30" font-family="Arial" font-size="20" text-anchor="start" font-weight="bold" fill="#172b3a">Освещение · управление</text>
<text x="16" y="62" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">S1 замкнут; катушка K1 активна</text>
<circle cx="90" cy="100" r="4" fill="white" stroke="#172b3a" stroke-width="2"/>
<text x="115" y="106" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">B1+</text>
<line x1="90" y1="100" x2="90" y2="140" stroke="#172b3a" stroke-width="3" />
<rect x="80" y="140" width="20" height="40" fill="white" stroke="#172b3a" stroke-width="3"/>
<line x1="90" y1="140" x2="90" y2="180" stroke="#172b3a" stroke-width="3" />
<text x="118" y="166" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">F2</text>
<line x1="90" y1="180" x2="90" y2="220" stroke="#172b3a" stroke-width="3" />
<circle cx="90" cy="220" r="4" fill="white" stroke="#172b3a" stroke-width="2"/>
<circle cx="90" cy="268" r="4" fill="white" stroke="#172b3a" stroke-width="2"/>
