<text x="114" y="248" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">S1</text>
<line x1="90" y1="268" x2="90" y2="330" stroke="#172b3a" stroke-width="3" />
<circle cx="90" cy="317" r="5" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<text x="119" y="323" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">86</text>
<rect x="72" y="330" width="36" height="62" fill="white" stroke="#172b3a" stroke-width="3"/>
<text x="126" y="370" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">K1</text>
<line x1="90" y1="392" x2="90" y2="457" stroke="#172b3a" stroke-width="3" />
<circle cx="90" cy="413" r="5" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<text x="120" y="419" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">85</text>
<line x1="90" y1="457" x2="90" y2="475" stroke="#172b3a" stroke-width="3" />
<line x1="66" y1="475" x2="114" y2="475" stroke="#172b3a" stroke-width="3" />
<line x1="72" y1="475" x2="62" y2="489" stroke="#172b3a" stroke-width="3" />
<line x1="90" y1="475" x2="80" y2="489" stroke="#172b3a" stroke-width="3" />
<line x1="108" y1="475" x2="98" y2="489" stroke="#172b3a" stroke-width="3" />
<text x="128" y="487" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">G2</text>
<text x="16" y="521" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">G2 → кузов → B1−</text>
<text x="16" y="550" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Катушка без диода в примере</text>
