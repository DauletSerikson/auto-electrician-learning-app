<svg xmlns="http://www.w3.org/2000/svg" width="320" height="602" viewBox="0 0 320 602">
<title>diagnosis_points</title>
<desc>Номинальная схема B1+–F1–P–Q–H1–G1–B1−. Учебная неисправность для задания: обрыв провода P–Q, не нарисованный как готовая подсказка. P соответствует fuseOutputVoltage, Q lampPositiveVoltage в diagnosticCase; без дополнительных реле/разъёмов. При прозвонке участок P–Q обесточен и изолирован.</desc>
<rect width="320" height="602" fill="white"/>
