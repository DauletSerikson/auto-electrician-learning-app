<line x1="85" y1="170" x2="85" y2="222" stroke="#172b3a" stroke-width="3" />
<circle cx="85" cy="222" r="5" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<text x="119" y="228" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">P</text>
<line x1="85" y1="222" x2="85" y2="315" stroke="#172b3a" stroke-width="3" />
<circle cx="85" cy="315" r="5" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<text x="119" y="321" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">Q</text>
<line x1="85" y1="315" x2="85" y2="368" stroke="#172b3a" stroke-width="3" />
<circle cx="85" cy="390" r="22" fill="white" stroke="#172b3a" stroke-width="2"/>
<line x1="70" y1="375" x2="100" y2="405" stroke="#172b3a" stroke-width="3" />
<line x1="70" y1="405" x2="100" y2="375" stroke="#172b3a" stroke-width="3" />
<text x="121" y="396" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">H1</text>
<line x1="85" y1="412" x2="85" y2="452" stroke="#172b3a" stroke-width="3" />
<line x1="85" y1="452" x2="85" y2="470" stroke="#172b3a" stroke-width="3" />
<line x1="61" y1="470" x2="109" y2="470" stroke="#172b3a" stroke-width="3" />
<line x1="67" y1="470" x2="57" y2="484" stroke="#172b3a" stroke-width="3" />
<line x1="85" y1="470" x2="75" y2="484" stroke="#172b3a" stroke-width="3" />
