<text x="123" y="482" font-family="Arial" font-size="18" text-anchor="start" font-weight="bold" fill="#172b3a">G1</text>
<text x="16" y="518" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">P — выход F1; Q — плюс H1</text>
<text x="16" y="546" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">G1 → кузов → B1−</text>
<text x="16" y="574" font-family="Arial" font-size="18" text-anchor="start" font-weight="normal" fill="#172b3a">Дефект устанавливают проверкой</text>
