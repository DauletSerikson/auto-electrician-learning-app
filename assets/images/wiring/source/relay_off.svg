<svg xmlns="http://www.w3.org/2000/svg" width="320" height="735" viewBox="0 0 320 735">
<title>relay_off</title>
<desc>Переключающее реле K1. S1 разомкнут, катушка не возбуждена, контакт 30–87a замкнут, 30–87 разомкнут. Работает H2. F1 защищает силовой путь, F2 управление. D1 включён параллельно катушке: катод к 86, анод к 85; при поданном штатном напряжении заперт. B1+ и B1− обозначают выводы одного источника. Пунктир — только механическая связь.</desc>
