<svg xmlns="http://www.w3.org/2000/svg" width="320" height="690" viewBox="0 0 320 690">
<title>starter_test_points</title><desc>Силовой путь D11: B1+ через кабель к C входа главного контакта K3, затем к M+ и M1; возврат от корпуса G3 через соединение к N=B1−. В исходном рисунке K3 открыт. При медленном вращении K3 замкнут, задаются потенциалы M+/G3/N и повышенный R соединения возврата. Команда 50 приходит отдельно из starter_control; K3 функциональный привод, не K2 обычного реле.</desc>
<rect width="320" height="690" fill="white"/>
<text x="16" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="start" fill="#172b3a">Запуск · точки силового пути</text>
<text x="16" y="62" font-family="Arial" font-size="18" font-weight="normal" text-anchor="start" fill="#172b3a">K3 исходно открыт; N = B1−</text>
<circle cx="90" cy="104" r="4" fill="white" stroke="#172b3a" stroke-width="2"/>
<text x="125" y="110" font-family="Arial" font-size="18" font-weight="bold" text-anchor="start" fill="#172b3a">B1+</text>
