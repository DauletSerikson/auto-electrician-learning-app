<text x="130" y="386" font-family="Arial" font-size="18" font-weight="bold" text-anchor="start" fill="#172b3a">M1</text>
<line x1="90" y1="404" x2="90" y2="453" stroke="#172b3a" stroke-width="3"/>
<circle cx="90" cy="453" r="5" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
