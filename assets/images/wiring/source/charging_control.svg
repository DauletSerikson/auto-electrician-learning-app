<svg xmlns="http://www.w3.org/2000/svg" width="320" height="588" viewBox="0 0 320 588">
<title>charging_control</title>
<desc>I: выбранный традиционный регулятор с выводом L подключён к контрольной лампе H3 от питания 15; внутренние пути возбуждения и массы опущены. II: ECU обменивается данными с регулятором G1 по LIN, линия пунктирная как сигнал данных в этой локальной легенде. Это альтернативные архитектуры, не одна универсальная схема; питание/масса блоков опущены и берутся с силового фрагмента.</desc>
