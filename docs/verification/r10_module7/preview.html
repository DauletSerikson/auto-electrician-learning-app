<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R10 — 360 px, текст ×1,3</title>
<style>
body { margin:24px; font:16px system-ui,sans-serif; background:#eee; color:#172b3a }
h1 { font-size:24px }
select { font:inherit; padding:8px }
main { display:flex; flex-wrap:wrap; align-items:flex-start; gap:24px; margin-top:24px }
article { width:360px; max-width:100%; background:white; border:1px solid #bbb }
article h2 { font-size:18px; margin:12px }
img { width:360px; max-width:100%; height:auto; display:block }
body.dark { background:#101215; color:#f4f4f4 }
body.dark article { background:#101215; border-color:#777 }
</style>
<h1>Модуль 7: 19 композиций, 360 px, текст ×1,3</h1>
<p>Реальный Flutter renderer. Длинные снимки требуют прокрутки; PNG-подписи не увеличиваются с системным текстом.</p>
<label>Тема <select id="theme"><option value="light">Светлая</option><option value="dark">Тёмная</option><option value="both">Обе</option></select></label>
<main id="gallery"></main>
<script>
const pilot=['ntc_divider','sensor_three_wire','hall_open_drain','inductive_sensor','analog_pressure_graph','discrete_contact','discrete_states','pulse_frequency','pwm_duty','same_average','sensor_reference_ground'];
const added=['control_loop','ecu_paths','driver_sides','low_side_pwm','can_topology','can_levels','lin_topology','lin_schedule'];
function render() {
  const theme=document.getElementById('theme').value;
  document.body.classList.toggle('dark',theme==='dark');
  const gallery=document.getElementById('gallery'); gallery.replaceChildren();
  for(const stem of [...pilot,...added]) for(const mode of (theme==='both'?['light','dark']:[theme])) {
    const card=document.createElement('article'), title=document.createElement('h2'), img=document.createElement('img');
    title.textContent=`${stem} · ${mode}`;
    img.src=`${pilot.includes(stem)?'../r10_pilot/':''}${stem}_${mode}_360.png`;
    img.alt=`${stem}, ${mode}, Flutter 360 px ×1,3`; img.loading='lazy';
    card.append(title,img); gallery.append(card);
  }
}
document.getElementById('theme').addEventListener('change',render); render();
</script>
</html>
